<title>Rumo Projetos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Identidade Rumo: branco, azul e cinza. Menu lateral azul, área de trabalho cinza-azulada com superfícies brancas. */
:root {
  --bg: #f4f6fa; --side: #1739a3; --surface: #ffffff; --hover: #eef2f8; --sel: #e3eaf6;
  --line: #e1e6ef; --line-2: #edf0f5;
  --ink: #0b1836; --ink-2: #4a5568; --ink-3: #8792a6;
  --primary: #1152f7; --primary-ink: #ffffff;
  --accent: #1152f7; --accent-soft: #e6eefe;
  --side-ink: #ffffff; --side-ink-2: rgba(255,255,255,.72); --side-ink-3: rgba(255,255,255,.5); --side-hover: rgba(255,255,255,.09); --side-sel: rgba(255,255,255,.16); --side-line: rgba(255,255,255,.12);
  --ok: #16a34a; --bad: #dc2626; --warn: #d97706;
  --p1: #dc2626; --p2: #ea8a0c; --p3: #1152f7; --p4: #c3cad6;
  --bar: #1152f7; --bar-hover: #0b1836; --grid: #edf0f5;
  --f-ui: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1120; --side: #0f245f; --surface: #111a2c; --hover: #17223a; --sel: #1d2a47;
  --line: #243049; --line-2: #1a2438;
  --ink: #e8edf6; --ink-2: #a7b2c6; --ink-3: #6f7b92;
  --primary: #4b7bf5; --primary-ink: #ffffff;
  --accent: #6b93ff; --accent-soft: #162a55;
  --side-ink: #ffffff; --side-ink-2: rgba(255,255,255,.7); --side-ink-3: rgba(255,255,255,.45); --side-hover: rgba(255,255,255,.07); --side-sel: rgba(255,255,255,.13); --side-line: rgba(255,255,255,.1);
  --ok: #4ade80; --bad: #f87171; --warn: #fbbf24;
  --p1: #f87171; --p2: #fbbf24; --p3: #6b93ff; --p4: #3c4760;
  --bar: #6b93ff; --bar-hover: #a5bdff; --grid: #1a2438; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0b1120; --side: #0f245f; --surface: #111a2c; --hover: #17223a; --sel: #1d2a47;
  --line: #243049; --line-2: #1a2438;
  --ink: #e8edf6; --ink-2: #a7b2c6; --ink-3: #6f7b92;
  --primary: #4b7bf5; --primary-ink: #ffffff;
  --accent: #6b93ff; --accent-soft: #162a55;
  --side-ink: #ffffff; --side-ink-2: rgba(255,255,255,.7); --side-ink-3: rgba(255,255,255,.45); --side-hover: rgba(255,255,255,.07); --side-sel: rgba(255,255,255,.13); --side-line: rgba(255,255,255,.1);
  --ok: #4ade80; --bad: #f87171; --warn: #fbbf24;
  --p1: #f87171; --p2: #fbbf24; --p3: #6b93ff; --p4: #3c4760;
  --bar: #6b93ff; --bar-hover: #a5bdff; --grid: #1a2438; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 500; }
h1 { font-size: 22px; letter-spacing: -.01em; }
h2 { font-size: 15px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); } .small { font-size: 12px; }
.eyebrow { font-size: 12px; font-weight: 500; color: var(--ink-3); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { flex: none; display: block; }

.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
aside.side { background: var(--side); color: var(--side-ink); padding: 20px 12px; display: flex; flex-direction: column; gap: 1px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.logo { font-weight: 700; font-size: 18px; letter-spacing: -.03em; display: flex; align-items: center; gap: 10px; padding: 0 8px 22px; color: var(--side-ink); }
.logo img { width: 30px; height: 30px; flex: none; display: block; filter: drop-shadow(0 2px 6px rgba(0, 10, 40, .25)); }
.logo { font-weight: 800; letter-spacing: -.04em; }
.brandmark { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 26px; letter-spacing: -.045em; color: var(--ink); }
.brandmark img { width: 44px; height: 44px; }
.boot { min-height: 60vh; display: grid; place-items: center; }
.boot img { width: 56px; height: 56px; animation: bootpulse 1.4s ease-in-out infinite; }
@keyframes bootpulse { 50% { transform: scale(.92); opacity: .7; } }
@media (prefers-reduced-motion: reduce) { .boot img { animation: none; } }
.nav-btn { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 6px 10px; border-radius: 7px; cursor: pointer; text-align: left; color: var(--ink-2); font-size: 13.5px; min-width: 0; height: 34px; }
.nav-btn:hover { background: var(--hover); color: var(--ink); }
.nav-btn .ico { width: 16px; display: grid; place-items: center; flex: none; color: var(--ink-3); }
aside.side .nav-btn { color: var(--side-ink-2); }
aside.side .nav-btn:hover { background: var(--side-hover); color: var(--side-ink); }
aside.side .nav-btn .ico { color: var(--side-ink-3); }
aside.side .nav-btn[aria-current="page"] { background: var(--side-sel); color: var(--side-ink); font-weight: 500; box-shadow: inset 2px 0 0 #fff; }
aside.side .nav-btn[aria-current="page"] .ico { color: var(--side-ink); }
aside.side .nav-btn .cnt { color: var(--side-ink-3); }
aside.side .nav-btn[aria-current="page"] .cnt { color: var(--side-ink-2); }
aside.side .eyebrow { color: var(--side-ink-3); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
aside.side .btn.ghost { color: var(--side-ink-3); }
aside.side .btn.ghost:hover { color: var(--side-ink); background: var(--side-hover); }
aside.side .dot { box-shadow: 0 0 0 1.5px rgba(255,255,255,.35); }
.side-cta { margin-top: auto; padding: 14px 12px; border-radius: 10px; background: var(--side-hover); color: var(--side-ink-2); font-size: 12px; line-height: 1.45; }
.side-cta b { color: var(--side-ink); font-weight: 600; display: block; margin-bottom: 2px; font-size: 13px; }
.nav-btn .nl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-btn .cnt { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.side-sep { margin: 22px 10px 6px; padding-top: 16px; border-top: 1px solid var(--side-line); display: flex; align-items: center; justify-content: space-between; }
.dot { width: 8px; height: 8px; border-radius: 2px; flex: none; display: inline-block; }
main.work { padding: 32px 40px 72px; min-width: 0; max-width: 1400px; }
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  aside.side { position: static; height: auto; flex-direction: row; flex-wrap: nowrap; overflow-x: auto; padding: 8px 12px; gap: 2px; scrollbar-width: none; }
  .nav-btn { flex: none; }
  .logo { padding: 0 10px 0 4px; height: 34px; }
  .logo img { width: 26px; height: 26px; }
  .side-cta { display: none; }
  .nav-btn { width: auto; }
  .side-sep, .side-projects-title { display: none; }
  main.work { padding: 20px 16px 64px; }
}

.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.stack { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.card.flat { border-color: var(--line-2); }
.head { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; margin-bottom: 4px; }
.head .sub { color: var(--ink-3); margin-top: 4px; font-size: 13px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 0 12px; height: 32px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--hover); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary, .btn.dark { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn.primary:hover, .btn.dark:hover { filter: brightness(1.08); background: var(--primary); }
.btn.danger { color: var(--bad); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn.ghost { border-color: transparent; background: none; color: var(--ink-3); padding: 0 6px; }
.btn.ghost:hover { color: var(--ink); background: var(--hover); }
.btn.link { border: 0; background: none; color: var(--accent); padding: 0; height: auto; font-weight: 500; }
kbd { font-family: var(--f-mono); font-size: 10.5px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-3); border-radius: 4px; padding: 0 4px; line-height: 16px; }

.input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 0 10px; height: 34px; outline: none; min-width: 0; }
textarea.input { padding: 8px 10px; height: auto; resize: vertical; }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
label.lbl, span.lbl { display: block; font-size: 12px; font-weight: 500; color: var(--ink-2); margin-bottom: 6px; }
.form-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.span-all { grid-column: 1 / -1; }
/* Abas sublinhadas */
.seg { display: flex; gap: 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 8px 0; margin-bottom: -1px; cursor: pointer; font-size: 13.5px; color: var(--ink-3); border-bottom: 2px solid transparent; display: inline-flex; align-items: center; gap: 6px; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }
.seg.pill { gap: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; display: inline-flex; }
.seg.pill button { padding: 0 10px; height: 28px; margin: 0; border: 0; font-size: 12px; }
.seg.pill button[aria-pressed="true"] { background: var(--sel); }

/* Quick add */
.quick { display: flex; flex-direction: column; gap: 6px; }
.quick-box { display: flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 0 6px 0 12px; height: 42px; background: var(--surface); color: var(--ink-3); }
.quick-box:focus-within { border-color: var(--ink-3); color: var(--ink); }
.quick-box input { border: 0; outline: none; background: none; flex: 1; min-width: 0; font-size: 14px; color: var(--ink); }
.quick-box input::placeholder { color: var(--ink-3); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 1px 8px; border-radius: 4px; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }

/* Lista de tarefas */
.tlist { list-style: none; margin: 0; padding: 0 14px; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.card .tlist, .card.flat .tlist { padding: 0; border: 0; border-radius: 0; background: none; }
.tlist .titem:last-child { border-bottom: 0; }
.titem { display: flex; gap: 12px; align-items: flex-start; padding: 10px 2px; border-bottom: 1px solid var(--line-2); min-width: 0; }
.titem .body { flex: 1; min-width: 0; cursor: pointer; }
.titem .title { overflow-wrap: anywhere; }
.titem.done .title, .kcard.done .title { text-decoration: line-through; color: var(--ink-3); }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 2px; font-size: 12px; color: var(--ink-3); align-items: center; }
.meta > span { display: inline-flex; align-items: center; gap: 4px; }
.due.late { color: var(--bad); } .due.today { color: var(--ink-2); }
.check { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--p4); background: none; cursor: pointer; display: grid; place-items: center; margin-top: 2px; padding: 0; color: transparent; }
.check.p1 { border-color: var(--p1); } .check.p2 { border-color: var(--p2); } .check.p3 { border-color: var(--p3); }
.check:hover { color: var(--ink-3); }
.check.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.sec-h { display: flex; align-items: center; gap: 8px; margin: 8px 0 8px; font-weight: 600; font-size: 13px; }
.sec-h .n { color: var(--ink-3); font-weight: 400; }
.sec-h.btn { border-bottom: 0; height: auto; }
.empty { padding: 20px 0; color: var(--ink-3); font-size: 13px; }

/* Kanban */
.board { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 12px; align-items: flex-start; }
.col { flex: 0 0 280px; border-radius: 8px; padding: 4px; display: flex; flex-direction: column; gap: 6px; }
.col.over { background: var(--sel); }
.col-h { display: flex; align-items: center; gap: 6px; padding: 4px 6px 8px; }
.col-h .name { font-weight: 500; font-size: 13px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.col-list { display: flex; flex-direction: column; gap: 6px; min-height: 40px; }
.kcard { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: grab; display: flex; gap: 10px; align-items: flex-start; }
.kcard:hover { border-color: var(--ink-3); }
.kcard.dragging { opacity: .35; }
.kcard.drop-before { box-shadow: 0 -2px 0 var(--accent); }
.kcard .title { overflow-wrap: anywhere; font-size: 13.5px; }
.knote { margin-top: 4px; font-size: 12.5px; line-height: 1.45; color: var(--ink-2); white-space: pre-line; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.kcard.done .knote { color: var(--ink-3); }
.add-col { flex: 0 0 220px; padding-top: 4px; }

/* Calendário */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); background: var(--surface); border-radius: 10px; overflow: hidden; }
.cal .dow, .cal .day { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.cal .dow { padding: 6px 8px; font-size: 11.5px; color: var(--ink-3); }
.cal .day { min-height: 112px; padding: 6px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; min-width: 0; }
.cal .day:hover { background: var(--hover); }
.cal .day.out .dnum { color: var(--ink-3); opacity: .6; }
.cal .day.today .dnum { background: var(--accent); color: #fff; }
.cal .day.sel { background: var(--hover); }
.cal .day.over { background: var(--accent-soft); }
.dnum { font-size: 12px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; }
.evt { font-size: 11.5px; padding: 1px 6px; border-radius: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-left: 2px solid var(--ink-3); cursor: grab; color: var(--ink-2); background: var(--bg); }
.evt.done { text-decoration: line-through; color: var(--ink-3); }
@media (max-width: 700px) { .cal .day { min-height: 60px; } .evt { font-size: 0; padding: 0; height: 4px; } .cal .dow { padding: 4px; font-size: 10px; } }
.cal-layout { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr) 320px; align-items: start; }
@media (max-width: 1100px) { .cal-layout { grid-template-columns: minmax(0, 1fr); } }

/* Dashboard */
.kpis { background: var(--surface); display: grid; gap: 0; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.kpi { border: 0; border-radius: 0; box-shadow: inset -1px -1px 0 var(--line); padding: 16px 18px; }
.kpi .v { font-size: 26px; font-weight: 400; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.2; margin-top: 6px; }
.kpi .v small { font-size: 14px; color: var(--ink-3); }
.bar-track { height: 4px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 99px; background: var(--accent); }
.chart { position: relative; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--ink-3); font-size: 11px; font-family: var(--f-ui); }
.chart .val { fill: var(--ink-2); }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 6px; padding: 4px 8px; font-size: 12px; transform: translate(-50%, -115%); white-space: nowrap; }
.grid-2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); align-items: start; }

/* Hoje */
.today-top { display: grid; gap: 32px; grid-template-columns: minmax(0, 1fr) 260px; align-items: start; }
@media (max-width: 1000px) { .today-top { grid-template-columns: minmax(0, 1fr); } }
.ring { position: relative; width: 88px; height: 88px; flex: none; }
.ring svg { transform: rotate(-90deg); }
.ring .c { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ring .c b { font-size: 22px; font-weight: 500; line-height: 1; }
.streak { font-size: 20px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }

/* Claude */
.ai:not(.msg) { border: 1px solid var(--line); border-left: 3px solid var(--accent); background: var(--surface); border-radius: 10px; padding: 14px 16px; }
.ai-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--ink); }
.ai-badge .ic { color: var(--accent); }
.msgs { display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 88%; padding: 9px 12px; border-radius: 10px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13.5px; }
.msg.ai { background: var(--hover); align-self: flex-start; }
.msg.me { background: var(--primary); color: var(--primary-ink); align-self: flex-end; }
.thinking { color: var(--ink-3); }
.plan-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.plan-list label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.plan-list input { margin-top: 3px; accent-color: var(--accent); }

/* Modal / toasts */
.backdrop { position: fixed; inset: 0; background: rgba(9, 9, 11, .4); z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: 8vh 16px 16px; overflow-y: auto; }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; width: 100%; max-width: 560px; padding: 20px 22px; box-shadow: 0 16px 48px rgba(0,0,0,.18); }
.modal.wide { max-width: 740px; }
.modal-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.modal-h h2 { font-size: 16px; }
.toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: flex; flex-direction: column; gap: 6px; align-items: center; max-width: calc(100vw - 32px); }
.toast { background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 8px; font-size: 13px; display: flex; gap: 12px; align-items: center; }
.toast.bad { background: var(--bad); color: #fff; }
.toast button { border: 0; background: none; color: inherit; opacity: .75; cursor: pointer; font-weight: 500; padding: 0; }
.toast button:hover { opacity: 1; }
.subtasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.subtasks li { display: flex; align-items: center; gap: 8px; }
.subtasks input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { width: 22px; height: 22px; border-radius: 6px; border: 0; cursor: pointer; outline-offset: 2px; }
.swatch[aria-pressed="true"] { outline: 2px solid var(--ink); }
.tpl-grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.tpl { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 12px; cursor: pointer; }
.tpl:hover { background: var(--hover); }
.tpl[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.tpl b { display: block; margin-bottom: 2px; font-weight: 500; }
.note { background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; font-size: 13px; color: var(--ink-2); }
.proj-actions { display: flex; flex-direction: column; align-items: stretch; gap: 8px; margin-left: auto; width: 240px; max-width: 100%; }
.btn.cta { height: 40px; font-size: 14px; font-weight: 600; border-radius: 8px; box-shadow: 0 4px 14px color-mix(in srgb, var(--primary) 35%, transparent); }
.proj-tools { display: flex; flex-wrap: wrap; gap: 4px 10px; justify-content: flex-end; }
.proj-tools .btn { height: 26px; font-size: 12px; padding: 0 6px; }
.proj-tools .btn.danger { color: var(--bad); }
.head.proj { align-items: flex-start; }
.pill-state { display: inline-flex; align-items: center; gap: 6px; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

<script id="core">
/* ===== Núcleo sem DOM: datas, linguagem natural, recorrência, métricas, modelos e prompts do Claude ===== */
const RUMO = (() => {
  const pad = (n) => String(n).padStart(2, "0");
  const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseYmd = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
  const today = (now = new Date()) => ymd(now);
  const dow = (s) => parseYmd(s).getDay();
  const DIAS = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
  const DIAS_LONGO = ["domingo", "segunda", "terça", "quarta", "quinta", "sexta", "sábado"];
  const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
  const MESES_LONGO = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
  const diffDays = (a, b) => Math.round((parseYmd(a) - parseYmd(b)) / 86400000);
  const fmtDay = (s) => { const d = parseYmd(s); return `${DIAS[d.getDay()]}, ${d.getDate()} ${MESES[d.getMonth()]}`; };
  function relDay(s, t = today()) {
    const n = diffDays(s, t);
    if (n === 0) return "Hoje"; if (n === 1) return "Amanhã"; if (n === -1) return "Ontem";
    if (n > 1 && n < 7) return DIAS_LONGO[dow(s)][0].toUpperCase() + DIAS_LONGO[dow(s)].slice(1);
    return fmtDay(s);
  }
  const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  let seq = 0;
  const uid = (p) => p + Date.now().toString(36) + (seq++).toString(36) + Math.random().toString(36).slice(2, 6);

  const RECORRENCIA = { none: "Não repete", daily: "Todo dia", weekdays: "Dias úteis", weekly: "Toda semana", monthly: "Todo mês" };
  function nextOccurrence(data, rec, t = today()) {
    const base = data || t;
    if (rec === "daily") return addDays(base, 1);
    if (rec === "weekdays") { let d = addDays(base, 1); while (dow(d) === 0 || dow(d) === 6) d = addDays(d, 1); return d; }
    if (rec === "weekly") return addDays(base, 7);
    if (rec === "monthly") { const d = parseYmd(base); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + 1); const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, last)); return ymd(d); }
    return null;
  }

  // "Ligar pro João amanhã 14h #sdr p1 todo dia" → título + data/hora/projeto/prioridade/recorrência
  const WD = [["domingo", 0], ["dom", 0], ["segunda-feira", 1], ["segunda", 1], ["seg", 1], ["terça-feira", 2], ["terca-feira", 2], ["terça", 2], ["terca", 2], ["ter", 2], ["quarta-feira", 3], ["quarta", 3], ["qua", 3], ["quinta-feira", 4], ["quinta", 4], ["qui", 4], ["sexta-feira", 5], ["sexta", 5], ["sex", 5], ["sábado", 6], ["sabado", 6], ["sáb", 6], ["sab", 6]];
  function parseQuick(text, projects = [], t = today()) {
    let s = " " + text + " ";
    const out = { data: null, hora: null, projectId: null, prioridade: null, recorrencia: null, tags: [] };
    const take = (re, fn) => { s = s.replace(re, (...m) => { const r = fn(...m); return r === false ? m[0] : " "; }); };
    take(/\s#([\p{L}\p{N}_-]+)(?=\s)/iu, (_, name) => {
      const n = norm(name).replace(/[-_]/g, "");
      const p = projects.find((x) => norm(x.nome).replace(/[\s-_]/g, "").startsWith(n)) ?? projects.find((x) => norm(x.nome).includes(n));
      if (!p) return false; out.projectId = p.id;
    });
    take(/\s(?:p|!)([1-4])(?=\s)/i, (_, n) => { out.prioridade = Number(n); });
    s = s.replace(/\s@([\p{L}\p{N}_-]+)(?=\s)/gu, (_, name) => { if (!out.tags.some((x) => norm(x) === norm(name))) out.tags.push(name); return " "; });
    take(/\s(todo dia|todos os dias|diariamente)(?=\s)/i, () => { out.recorrencia = "daily"; });
    take(/\s(dias úteis|dias uteis|todo dia útil|todo dia util)(?=\s)/i, () => { out.recorrencia = "weekdays"; });
    take(/\s(toda semana|todas as semanas|semanalmente)(?=\s)/i, () => { out.recorrencia = "weekly"; });
    take(/\s(todo mês|todo mes|todos os meses|mensalmente)(?=\s)/i, () => { out.recorrencia = "monthly"; });
    take(/\s(?:às |as )?(\d{1,2})(?:h(\d{2})?|:(\d{2}))(?=\s)/i, (_, h, m1, m2) => { const hh = Number(h), mm = Number(m1 || m2 || 0); if (hh > 23 || mm > 59) return false; out.hora = `${pad(hh)}:${pad(mm)}`; });
    take(/\s(depois de amanhã|depois de amanha)(?=\s)/i, () => { out.data = addDays(t, 2); });
    take(/\s(amanhã|amanha)(?=\s)/i, () => { out.data = addDays(t, 1); });
    take(/\s(hoje)(?=\s)/i, () => { out.data = t; });
    take(/\sem (\d{1,3}) dias?(?=\s)/i, (_, n) => { out.data = addDays(t, Number(n)); });
    take(/\s(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?=\s)/, (_, d, m, y) => {
      const td = parseYmd(t); let yy = y ? Number(y.length === 2 ? "20" + y : y) : td.getFullYear();
      const dt = new Date(yy, Number(m) - 1, Number(d));
      if (dt.getMonth() !== Number(m) - 1) return false;
      if (!y && ymd(dt) < t) dt.setFullYear(yy + 1);
      out.data = ymd(dt);
    });
    if (!out.data) for (const [w, n] of WD) {
      // Só vira data com "na/no/próxima" antes ou no fim do texto ("Segunda reunião…" continua título).
      const re = new RegExp(`\\s(?:(?:na|no|próxima|proxima|próximo|proximo)\\s${w}(?=\\s)|${w}(?=\\s*$))`, "i");
      if (re.test(s)) { s = s.replace(re, " "); let d = addDays(t, 1); while (dow(d) !== n) d = addDays(d, 1); out.data = d; break; }
    }
    if (out.recorrencia && !out.data) out.data = t;
    if (out.hora && !out.data) out.data = t;
    out.titulo = s.replace(/\s+/g, " ").trim();
    return out;
  }

  const TAG_COLORS = ["#2156e0", "#0891b2", "#16a34a", "#65a30d", "#d97706", "#ea580c", "#dc2626", "#db2777", "#9333ea", "#64748b"];
  // Resolve nomes de tag (@nome) contra as tags do projeto; cria as que faltam com a próxima cor livre.
  function resolveTags(project, names) {
    const tags = [...(project.tags || [])];
    const ids = [];
    for (const name of names) {
      const n = String(name).trim(); if (!n) continue;
      let tag = tags.find((x) => norm(x.nome) === norm(n));
      if (!tag) { const used = tags.map((x) => x.cor); tag = { id: uid("g"), nome: n.slice(0, 30), cor: TAG_COLORS.find((c) => !used.includes(c)) ?? TAG_COLORS[tags.length % TAG_COLORS.length] }; tags.push(tag); }
      if (!ids.includes(tag.id)) ids.push(tag.id);
    }
    return { tags, ids, changed: tags.length !== (project.tags || []).length };
  }
  const PROJECT_COLORS = ["#d24e12", "#2f6fdb", "#1d7a44", "#8b3fd1", "#c2185b", "#0f8a8a", "#b8860b", "#5b6472"];
  const DEFAULT_STAGES = () => [{ id: uid("s"), nome: "A fazer", final: false }, { id: uid("s"), nome: "Em andamento", final: false }, { id: uid("s"), nome: "Concluído", final: true }];
  const INBOX = { id: "inbox", nome: "Caixa de entrada", cor: "#5b6472", icone: "📥", descricao: "Tudo que ainda não tem projeto.", stages: [{ id: "s-inbox-todo", nome: "A fazer", final: false }, { id: "s-inbox-doing", nome: "Em andamento", final: false }, { id: "s-inbox-done", nome: "Concluído", final: true }], plano: null, chat: [], ordem: -1, createdAt: 0 };
  const firstOpenStage = (p) => p.stages.find((s) => !s.final) ?? p.stages[0];
  const finalStage = (p) => p.stages.find((s) => s.final) ?? p.stages[p.stages.length - 1];

  function newTask(fields, project, t = today()) {
    return {
      id: uid("t"), projectId: project.id, stageId: fields.stageId ?? firstOpenStage(project).id,
      titulo: String(fields.titulo || "").trim(), notas: fields.notas ?? "", data: fields.data ?? null, hora: fields.hora ?? null,
      duracao: fields.duracao ?? 30, prioridade: fields.prioridade ?? 4, recorrencia: fields.recorrencia ?? "none",
      subtarefas: (fields.subtarefas || []).map((x) => (typeof x === "string" ? { id: uid("st"), t: x, ok: false } : x)),
      concluida: false, concluidaEm: null, createdAt: Date.now(), ordem: Date.now(), gerouProxima: false, tags: fields.tags ?? [],
    };
  }
  // Concluir/desfazer: move para a etapa final; tarefas recorrentes geram a próxima ocorrência uma única vez.
  function setDone(task, project, done, t = today()) {
    const upd = { ...task, concluida: done, concluidaEm: done ? Date.now() : null };
    const fs = finalStage(project), os = firstOpenStage(project);
    if (done && fs) upd.stageId = fs.id;
    if (!done && project.stages.find((s) => s.id === task.stageId)?.final) upd.stageId = os.id;
    let next = null;
    if (done && task.recorrencia && task.recorrencia !== "none" && !task.gerouProxima) {
      upd.gerouProxima = true;
      next = { ...task, id: uid("t"), stageId: os.id, data: nextOccurrence(task.data && task.data > t ? task.data : (task.data || t), task.recorrencia, t), concluida: false, concluidaEm: null, createdAt: Date.now(), ordem: Date.now(), gerouProxima: false, subtarefas: (task.subtarefas || []).map((x) => ({ ...x, ok: false })) };
      if (next.data < t) { next.data = t; while (task.recorrencia === "weekdays" && (dow(next.data) === 0 || dow(next.data) === 6)) next.data = addDays(next.data, 1); }
    }
    return { task: upd, next };
  }
  function moveToStage(task, project, stageId, t = today()) {
    const st = project.stages.find((s) => s.id === stageId);
    if (!st) return { task, next: null };
    if (st.final && !task.concluida) { const r = setDone(task, project, true, t); r.task.stageId = stageId; return r; }
    if (!st.final && task.concluida) { const r = setDone(task, project, false, t); r.task.stageId = stageId; return r; }
    return { task: { ...task, stageId }, next: null };
  }

  const doneDay = (task) => (task.concluidaEm ? ymd(new Date(task.concluidaEm)) : null);
  function metrics(tasks, projects, settings, t = today()) {
    const meta = Math.max(1, Number(settings.metaDiaria) || 5);
    const byDay = new Map();
    for (const k of tasks) if (k.concluida && k.concluidaEm) { const d = doneDay(k); byDay.set(d, (byDay.get(d) ?? 0) + 1); }
    const doneToday = byDay.get(t) ?? 0;
    const open = tasks.filter((k) => !k.concluida);
    const overdue = open.filter((k) => k.data && k.data < t);
    const dueToday = open.filter((k) => k.data === t);
    const createdToday = tasks.filter((k) => ymd(new Date(k.createdAt)) === t).length;
    let streak = 0;
    for (let d = addDays(t, -1); (byDay.get(d) ?? 0) >= meta; d = addDays(d, -1)) streak++;
    if (doneToday >= meta) streak++;
    let best = 0, run = 0;
    for (let i = 365; i >= 0; i--) { const d = addDays(t, -i); if ((byDay.get(d) ?? 0) >= meta) { run++; best = Math.max(best, run); } else run = 0; }
    const serie = [];
    for (let i = 13; i >= 0; i--) { const d = addDays(t, -i); serie.push({ dia: d, label: `${parseYmd(d).getDate()}/${parseYmd(d).getMonth() + 1}`, value: byDay.get(d) ?? 0 }); }
    const last7 = serie.slice(-7).reduce((s, x) => s + x.value, 0);
    const semana = serie.slice(-7).filter((x) => x.value >= meta).length;
    const recent = tasks.filter((k) => k.concluida && k.data && k.concluidaEm && diffDays(t, doneDay(k)) <= 30);
    const noPrazo = recent.filter((k) => doneDay(k) <= k.data).length;
    const porProjeto = projects.map((p) => {
      const ts = tasks.filter((k) => k.projectId === p.id);
      return { p, abertas: ts.filter((k) => !k.concluida).length, atrasadas: ts.filter((k) => !k.concluida && k.data && k.data < t).length, feitas7: ts.filter((k) => k.concluida && k.concluidaEm && diffDays(t, doneDay(k)) < 7).length, total: ts.length };
    }).filter((x) => x.total > 0);
    const porPrioridade = [1, 2, 3, 4].map((n) => ({ label: `P${n}`, value: open.filter((k) => k.prioridade === n).length }));
    return { meta, doneToday, abertas: open.length, overdue: overdue.length, dueToday: dueToday.length, createdToday, streak, best, serie, last7, semana, pctNoPrazo: recent.length ? noPrazo / recent.length : null, noPrazo, recentes: recent.length, porProjeto, porPrioridade };
  }

  // Modelos de projeto prontos (sem precisar do Claude).
  function template(key, t = today()) {
    const R = (titulo, recorrencia, hora, prioridade = 2) => ({ titulo, recorrencia, hora, prioridade });
    const T = (titulo, emDias, prioridade = 3, subtarefas = []) => ({ titulo, emDias, prioridade, subtarefas });
    const M = {
      sdr: {
        nome: "Prospecção SDR", icone: "📞", cor: "#d24e12",
        descricao: "Meta de 10 reuniões por dia com ~60 leads diários, SLA de 5 minutos no primeiro contato e cadência de follow-up por ligação, WhatsApp e e-mail.",
        etapas: ["A fazer", "Em andamento", "Aguardando retorno", "Concluído"],
        rotina: [
          R("Abertura: leads que chegaram fora do horário + follow-ups do dia", "weekdays", "08:00", 1),
          R("Plantão: primeiro contato em até 5 min em cada lead novo", "weekdays", "08:30", 1),
          R("Bloco de follow-ups da cadência (D1, D2, D4, D7)", "weekdays", "10:00", 2),
          R("Segundo bloco de ligações (horário diferente da manhã)", "weekdays", "14:00", 2),
          R("Confirmar por WhatsApp as reuniões de amanhã", "weekdays", "16:30", 1),
          R("Fechamento: revisar pendências e contar reuniões do dia (meta 10)", "weekdays", "16:45", 2),
          R("Revisar taxas da semana: contato, agendamento e no-show", "weekly", "16:00", 3),
        ],

  // Converte um plano (modelo ou vindo do Claude) em projeto + tarefas.
  function buildProject(info, plano, sel = {}, t = today()) {
    const etapas = (plano.etapas?.length >= 2 ? plano.etapas : ["A fazer", "Em andamento", "Concluído"]).slice(0, 8);
    const stages = etapas.map((nome, i) => ({ id: uid("s"), nome: String(nome).slice(0, 40), final: i === etapas.length - 1 }));
    const project = { id: uid("p"), nome: info.nome, cor: info.cor, icone: info.icone, descricao: info.descricao || plano.resumo || "", stages, plano: { resumo: plano.resumo || "", dicas: plano.dicas || [], mensagem: plano.mensagem || "" }, chat: info.chat || [], ordem: Date.now(), createdAt: Date.now() };
    const tasks = [];
    (plano.rotina || []).forEach((r, i) => {
      if (sel.rotina && !sel.rotina[i]) return;
      const rec = RECORRENCIA[r.recorrencia] ? r.recorrencia : "daily";
      let d = t; if (rec === "weekdays") while (dow(d) === 0 || dow(d) === 6) d = addDays(d, 1);
      tasks.push(newTask({ titulo: r.titulo, recorrencia: rec, hora: /^\d{2}:\d{2}$/.test(r.hora || "") ? r.hora : null, data: d, prioridade: clampP(r.prioridade ?? 2) }, project, t));
    });
    (plano.tarefas || []).forEach((k, i) => {
      if (sel.tarefas && !sel.tarefas[i]) return;
      tasks.push(newTask({ titulo: k.titulo, data: Number.isFinite(Number(k.emDias)) ? addDays(t, Math.max(0, Math.round(Number(k.emDias)))) : null, prioridade: clampP(k.prioridade ?? 3), subtarefas: (k.subtarefas || []).slice(0, 10).map(String) }, project, t));
    });
    tasks.forEach((k, i) => (k.ordem = Date.now() + i));
    return { project, tasks };
  }
  const clampP = (n) => Math.min(4, Math.max(1, Math.round(Number(n) || 4)));

  // Prompts para o Claude
  function interviewInstructions(nome, t = today()) {
    return `Você é o assistente de organização do app "Rumo", um gerenciador de projetos e tarefas com quadro kanban, calendário e metas diárias. Seu trabalho: entender o projeto da pessoa e propor como ela deve se organizar para executar com disciplina. Fale em português do Brasil, de forma direta, prática e encorajadora.

Fluxo: a pessoa descreve o projeto. Se faltar algo essencial (objetivo concreto, prazo ou tempo disponível por dia/semana), faça UMA pergunta curta por vez, no máximo 2 perguntas no total. Depois disso, entregue o plano.

Responda SOMENTE com um JSON em um destes dois formatos:
{"tipo":"pergunta","mensagem":"sua pergunta"}
{"tipo":"plano","mensagem":"3 a 5 frases explicando como se organizar","plano":{"resumo":"uma frase com o objetivo","etapas":["A fazer","Em andamento","Concluído"],"rotina":[{"titulo":"hábito ou bloco fixo","recorrencia":"daily|weekdays|weekly|monthly","hora":"HH:MM","prioridade":2}],"tarefas":[{"titulo":"começa com verbo","emDias":0,"prioridade":1,"subtarefas":["passo curto"]}],"dicas":["dica prática"]}}

Regras do plano: 3 a 6 etapas de kanban adequadas ao projeto (a última significa concluído); 2 a 6 itens de rotina que criem disciplina (blocos de horário fixos); 5 a 12 tarefas concretas com prazo realista em dias a partir de hoje (emDias) e prioridade de 1 (mais importante) a 4; no máximo 4 dicas.
Hoje é ${fmtDay(t)} (${t}). Nome do projeto: "${nome}".`;
  }
  function normalizePlan(j) {
    const p = j && typeof j === "object" ? j.plano ?? j : {};
    const arr = (x) => (Array.isArray(x) ? x : []);
    return {
      resumo: String(p.resumo || "").slice(0, 300), mensagem: String(j?.mensagem || "").slice(0, 1200),
      etapas: arr(p.etapas).map((x) => String(x).trim()).filter(Boolean).slice(0, 8),
      rotina: arr(p.rotina).filter((r) => r && r.titulo).slice(0, 8).map((r) => ({ titulo: String(r.titulo).slice(0, 140), recorrencia: RECORRENCIA[r.recorrencia] ? r.recorrencia : "daily", hora: /^\d{1,2}:\d{2}$/.test(r.hora || "") ? r.hora.padStart(5, "0") : null, prioridade: clampP(r.prioridade ?? 2) })),
      tarefas: arr(p.tarefas).filter((k) => k && k.titulo).slice(0, 15).map((k) => ({ titulo: String(k.titulo).slice(0, 160), emDias: Math.max(0, Math.round(Number(k.emDias) || 0)), prioridade: clampP(k.prioridade ?? 3), subtarefas: arr(k.subtarefas).map(String).slice(0, 8) })),
      dicas: arr(p.dicas).map(String).slice(0, 5),
    };
  }
  function dayPlanPrompt(list, settings, projects, t = today(), nowHM = "08:00") {
    const pn = (id) => projects.find((p) => p.id === id)?.nome ?? "Caixa de entrada";
    const linhas = list.slice(0, 60).map((k) => `- id=${k.id} | "${k.titulo}" | projeto: ${pn(k.projectId)} | prioridade P${k.prioridade} | ${k.data < t ? `ATRASADA desde ${k.data}` : "para hoje"}${k.hora ? ` | horário marcado ${k.hora}` : ""} | ~${k.duracao || 30} min${k.recorrencia !== "none" ? " | rotina" : ""}`).join("\n");
    return `Você organiza o dia de uma pessoa no app de tarefas "Rumo". Monte um plano realista para hoje (${fmtDay(t)}), começando a partir de ${nowHM}, dentro do expediente de ${settings.inicio} às ${settings.fim}. Respeite horários já marcados, coloque as prioridades mais altas e as atrasadas mais cedo, agrupe tarefas parecidas e deixe pequenas pausas. Se não couber tudo, diga o que adiar.

Tarefas:
${linhas}

Responda SOMENTE com JSON: {"resumo":"2 frases sobre o foco do dia","blocos":[{"id":"id da tarefa","inicio":"HH:MM","motivo":"até 10 palavras"}],"adiar":["id"],"dica":"uma dica de disciplina"}`;
  }
  function projectChatInstructions(project, tasks, t = today()) {
    const st = (id) => project.stages.find((s) => s.id === id)?.nome ?? "";
    const abertas = tasks.filter((k) => !k.concluida).slice(0, 50).map((k) => `- "${k.titulo}" (${st(k.stageId)}${k.data ? `, prazo ${k.data}` : ""}, P${k.prioridade}${k.recorrencia !== "none" ? ", rotina" : ""})`).join("\n") || "(nenhuma)";
    const feitas = tasks.filter((k) => k.concluida).length;
    return `Você é o assistente do app de tarefas "Rumo" e está ajudando no projeto "${project.nome}". Seja direto, prático e em português do Brasil.
Descrição: ${project.descricao || "(sem descrição)"}
${project.plano?.resumo ? `Objetivo: ${project.plano.resumo}\n` : ""}Etapas do quadro: ${project.stages.map((s) => s.nome).join(" → ")}
Tarefas abertas:
${abertas}
Tarefas concluídas: ${feitas}. Hoje é ${fmtDay(t)} (${t}).

${project.iaTarefas === false
  ? `A pessoa PAUSOU a geração de tarefas pelo Claude neste projeto: não proponha tarefas novas, apenas oriente. Responda SOMENTE com JSON: {"mensagem":"sua resposta","tarefas":[]}.`
  : `Responda SOMENTE com JSON: {"mensagem":"sua resposta","tarefas":[{"titulo":"...","emDias":0,"prioridade":2}]}. Inclua "tarefas" apenas quando sugerir tarefas novas concretas (no máximo 8); caso contrário use [].`}`;
  }

})();

/* ===== Armazenamento: banco do artefato (db) com fallback no navegador ===== */
const LS = "rumo-v1";
const DEFAULT_SETTINGS = { nome: "", metaDiaria: 5, inicio: "08:00", fim: "18:00" };
const store = {
  mode: "carregando", ready: false, db: null, projects: new Map(), tasks: new Map(), settings: null,
  pending: new Map(), chains: new Map(), subs: new Set(), ver: 0,
  emit() { this.ver++; this.subs.forEach((f) => f(this.ver)); },
  merged(kind) { const m = new Map(this[kind]); for (const [k, v] of this.pending) if (k.startsWith(kind + "/")) { const id = k.slice(kind.length + 1); v === null ? m.delete(id) : m.set(id, v); } return m; },
  projectList() { const m = this.merged("projects"); if (!m.has("inbox")) m.set("inbox", R.INBOX); return [...m.values()].filter((p) => !p.arquivado).sort((a, b) => (a.ordem ?? 0) - (b.ordem ?? 0)); },
  project(id) { return this.merged("projects").get(id) ?? (id === "inbox" ? R.INBOX : null); },
  taskList() { return [...this.merged("tasks").values()]; },
  get cfg() { return { ...DEFAULT_SETTINGS, ...(this.settings || {}) }; },
  async init() {
    let db = null, user = null;
    try { db = window.claude?.use ? await window.claude.use("db") : null; } catch { db = null; }
    try { user = window.claude?.use ? await window.claude.use("user") : null; } catch { user = null; }
    if (user) { try { this.me = await user.me(); } catch { this.me = null; } }
    const uid = this.me?.id ?? null;
    if (db && uid) {
      this.db = db; this.mode = "db"; this.base = `data/users/${uid}/profile`;
      let n = 0; const first = () => { if (++n === 3) { this.ready = true; } this.emit(); };
      const err = (e) => { this.error = e?.message || "Falha ao ler os dados."; this.emit(); };
      let a = 0, b = 0, c = 0;
      const root = db.doc(this.base);
      root.collection("projects").onSnapshot((s) => { const m = new Map(); s.docs.forEach((d) => d.exists && m.set(d.id, d.data())); this.projects = m; a++ ? this.emit() : first(); }, err);
      root.collection("tasks").onSnapshot((s) => { const m = new Map(); s.docs.forEach((d) => d.exists && m.set(d.id, d.data())); this.tasks = m; b++ ? this.emit() : first(); }, err);
      root.onSnapshot((d) => { this.settings = d.exists ? d.data() : null; c++ ? this.emit() : first(); }, err);
      // Dados criados antes das contas (área compartilhada): só o dono enxerga e pode trazer para a conta dele.
      if (this.me?.isOwner) {
        try {
          const [ps, ts] = await Promise.all([db.collection("projects").get(), db.collection("tasks").get()]);
          this.legacy = { projects: ps.docs.filter((d) => d.exists).map((d) => d.data()), tasks: ts.docs.filter((d) => d.exists).map((d) => d.data()) };
          this.emit();
        } catch { this.legacy = null; }
      }
    } else {
      this.mode = "local";
      if (db && !uid) this.error = "Não foi possível identificar sua conta do claude.ai. Seus dados ficarão só neste navegador.";
      try { const j = JSON.parse(localStorage.getItem(LS) || "null"); if (j) { (j.projects || []).forEach((p) => this.projects.set(p.id, p)); (j.tasks || []).forEach((t) => this.tasks.set(t.id, t)); this.settings = j.settings || null; } } catch {}
      this.ready = true; this.emit();
    }
  },
  // Copia os projetos/tarefas antigos (compartilhados) para a conta e apaga a cópia compartilhada.
  async migrateLegacy(onProgress) {
    const L = this.legacy; if (!L || this.mode !== "db") return 0;
    const all = [...L.projects.map((x) => ["projects", x]), ...L.tasks.map((x) => ["tasks", x])];
    let i = 0;
    for (const [kind, doc] of all) { await this.write(`${this.base}/${kind}/${doc.id}`, doc); onProgress?.(++i, all.length); }
    for (const [kind, doc] of all) await this.write(`${kind}/${doc.id}`, null).catch(() => {});
    this.legacy = null; this.emit();
    return all.length;
  },
  persist() { if (this.mode === "local") try { localStorage.setItem(LS, JSON.stringify({ projects: [...this.projects.values()], tasks: [...this.tasks.values()], settings: this.settings })); } catch {} },
  write(path, data) {
    const prev = this.chains.get(path) || Promise.resolve();
    const run = async () => {
      const ref = this.db.doc(path);
      for (let i = 0; i < 3; i++) {
        try { data === null ? await ref.delete() : await ref.set(data); return; }
        catch (e) { if ((e?.code === "unavailable" || e?.code === "resource_exhausted") && i < 2) { await new Promise((r) => setTimeout(r, 500 + Math.random() * 800 * (i + 1))); continue; } throw e; }
      }
    };
    const p = prev.then(run, run); this.chains.set(path, p.catch(() => {})); return p;
  },
  async put(kind, id, data) {
    const plain = data === null ? null : JSON.parse(JSON.stringify(data));
    if (this.mode === "local") { plain === null ? this[kind].delete(id) : this[kind].set(id, plain); this.persist(); this.emit(); return; }
    const key = kind + "/" + id; this.pending.set(key, plain); this.emit();
    try { await this.write(`${this.base}/${key}`, plain); }
    catch (e) { toast(e?.code === "quota_exceeded" ? "O banco está cheio. Apague tarefas concluídas antigas." : "Não foi possível salvar: " + (e?.message || e), "bad"); }
    finally { if (this.pending.get(key) === plain) this.pending.delete(key); this.emit(); }
  },
  saveTask(t) { if (t.projectId === "inbox" && !this.merged("projects").has("inbox")) this.put("projects", "inbox", R.INBOX); return this.put("tasks", t.id, t); },
  deleteTask(id) { return this.put("tasks", id, null); },
  saveProject(p) { return this.put("projects", p.id, p); },
  async deleteProject(id) { for (const t of this.taskList().filter((x) => x.projectId === id)) await this.put("tasks", t.id, null); await this.put("projects", id, null); },
  async saveSettings(s) { this.settings = { ...this.cfg, ...s }; if (this.mode === "local") { this.persist(); this.emit(); return; } this.emit(); try { await this.write(this.base, this.settings); } catch (e) { toast("Não foi possível salvar: " + (e?.message || e), "bad"); } },
};
function useStore() { const [, set] = useState(0); useEffect(() => { const f = (v) => set(v); store.subs.add(f); set(store.ver); return () => store.subs.delete(f); }, []); return store; }
function useToday() { const [t, set] = useState(R.today()); useEffect(() => { const id = setInterval(() => set(R.today()), 30000); return () => clearInterval(id); }, []); return t; }

/* Claude (capability sample) */
let samplePromise = null;
const getSample = () => (samplePromise ??= (window.claude?.use ? window.claude.use("sample").catch(() => null) : Promise.resolve(null)));
const AI_ERR = { not_granted: "Você não permitiu o uso do Claude nesta página.", sampling_disabled: "O Claude não está disponível para esta conta.", rate_limited: "Muitas perguntas seguidas. Tente de novo em instantes.", invalid_json: "O Claude respondeu fora do formato. Tente de novo.", refused: "O Claude não quis responder a isso. Reformule o pedido.", session_expired: "Sua sessão expirou. Entre de novo no claude.ai.", upstream_error: "Falha de conexão com o Claude. Tente de novo." };
const aiError = (e) => AI_ERR[e?.code] || "Não foi possível falar com o Claude agora.";
function useAI() { const [ok, set] = useState(null); useEffect(() => { getSample().then((s) => set(!!s)); }, []); return ok; }

/* Toasts */
const toastSubs = new Set();
function toast(msg, kind = "", action = null) { const t = { id: Math.random(), msg, kind, action }; toastSubs.forEach((f) => f(t)); }
function Toasts() {
  const [list, setList] = useState([]);
  useEffect(() => { const f = (t) => { setList((l) => [...l, t]); setTimeout(() => setList((l) => l.filter((x) => x.id !== t.id)), t.action ? 6000 : 3200); }; toastSubs.add(f); return () => toastSubs.delete(f); }, []);
  return html`<div class="toasts" role="status" aria-live="polite">${list.map((t) => html`<div key=${t.id} class=${"toast " + t.kind}><span>${t.msg}</span>${t.action && html`<button onClick=${() => { t.action.fn(); setList((l) => l.filter((x) => x.id !== t.id)); }}>${t.action.label}</button>`}</div>`)}</div>`;
}
const typing = (e) => { const t = e.target; return !!t && (t.isContentEditable || ["INPUT", "TEXTAREA", "SELECT"].includes(t.tagName)); };
const modalOpen = () => !!document.querySelector("[data-modal]");
const pctTxt = (v) => (v == null ? "—" : `${Math.round(v * 100)}%`);

/* Ações de tarefa (com desfazer) */
function toggleDone(task) {
  const p = store.project(task.projectId) ?? R.INBOX;
  const { task: upd, next } = R.setDone(task, p, !task.concluida);
  store.saveTask(upd); if (next) store.saveTask(next);
  if (upd.concluida) {
    const c = R.metrics(store.taskList(), [], store.cfg);
    toast(c.doneToday >= c.meta ? `Concluída. Meta do dia batida (${c.doneToday}/${c.meta})` : `Concluída · ${c.doneToday}/${c.meta} hoje`, "", { label: "Desfazer", fn: () => { store.saveTask(task); if (next) store.deleteTask(next.id); } });
  }
}
function googleLink(t) {
  if (!t.data) return null;
  const stamp = (d) => `${R.ymd(d).replace(/-/g, "")}T${R.pad(d.getHours())}${R.pad(d.getMinutes())}00`;
  let dates;
  if (t.hora) { const [h, m] = t.hora.split(":").map(Number); const s = R.parseYmd(t.data); s.setHours(h, m, 0, 0); const e = new Date(s.getTime() + (t.duracao || 30) * 60000); dates = `${stamp(s)}/${stamp(e)}`; }
  else dates = `${t.data.replace(/-/g, "")}/${R.addDays(t.data, 1).replace(/-/g, "")}`;
  const p = store.project(t.projectId);
  const details = [t.notas, p ? `Projeto: ${p.nome}` : "", "Criado no Rumo"].filter(Boolean).join("\n");
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(t.titulo)}&dates=${dates}&details=${encodeURIComponent(details)}`;
}

function Modal({ title, onClose, wide, children }) {

function TagPicker({ projectId, value, onChange }) {
  const st = useStore();
  const p = st.project(projectId) ?? R.INBOX;
  const [novo, setNovo] = useState("");
  const tags = p.tags || [];
  const toggle = (id) => onChange(value.includes(id) ? value.filter((x) => x !== id) : [...value, id]);
  function add(e) {
    e.preventDefault(); const n = novo.trim(); if (!n) return;
    const cur = store.project(projectId) ?? R.INBOX;
    const r = R.resolveTags(cur, [n]);
    if (r.changed) store.saveProject({ ...cur, tags: r.tags });
    onChange([...new Set([...value, ...r.ids])]); setNovo("");
  }
  return html`<div class="filterbar">
    ${tags.map((t) => html`<button type="button" key=${t.id} class=${"tg btnlike" + (value.includes(t.id) ? "" : " off")} style=${{ "--tc": t.cor }} aria-pressed=${value.includes(t.id)} onClick=${() => toggle(t.id)}><i></i>${t.nome}</button>`)}
    <form class="row" style=${{ gap: 4, flexWrap: "nowrap" }} onSubmit=${add}><input id=${"tagnew-" + projectId} class="input" style=${{ height: 26, width: 130, fontSize: 12.5 }} value=${novo} onInput=${(e) => setNovo(e.target.value)} placeholder="+ Nova tag" aria-label="Nova tag" /></form>
  </div>`;
}
function TagManager({ projectId, onClose }) {
  const st = useStore();
  const p = st.project(projectId);
  const [nome, setNome] = useState("");
  if (!p) return null;
  const tags = p.tags || [];
  const save = (list) => store.saveProject({ ...store.project(projectId), tags: list });
  const count = (id) => st.taskList().filter((t) => t.projectId === projectId && (t.tags || []).includes(id)).length;
  function add(e) { e.preventDefault(); const n = nome.trim(); if (!n) return; const r = R.resolveTags(p, [n]); if (r.changed) save(r.tags); else toast("Essa tag já existe."); setNome(""); }
  function remove(id) {
    save(tags.filter((t) => t.id !== id));
    st.taskList().filter((t) => t.projectId === projectId && (t.tags || []).includes(id)).forEach((t) => store.saveTask({ ...t, tags: t.tags.filter((x) => x !== id) }));
    toast("Tag excluída e removida das tarefas.");
  }
  return html`<${Modal} title=${`Tags de ${p.nome}`} onClose=${onClose}>
    <form class="row" style=${{ flexWrap: "nowrap", marginBottom: 8 }} onSubmit=${add}><input id="tm-nome" class="input" autoFocus value=${nome} onInput=${(e) => setNome(e.target.value)} placeholder="Nome da nova tag (ex.: Revisão, Urgente, Leitura)" /><button class="btn primary" disabled=${!nome.trim()}>Criar</button></form>
    ${tags.length === 0 ? html`<p class="small muted">Nenhuma tag ainda. Crie acima ou digite <b>@nome</b> ao criar uma tarefa.</p>` : tags.map((t) => html`<div key=${t.id} class="tag-row">
      <input id=${"tm-" + t.id} class="input" style=${{ height: 30 }} defaultValue=${t.nome} onBlur=${(e) => { const v = e.target.value.trim(); if (v && v !== t.nome) save(tags.map((x) => (x.id === t.id ? { ...x, nome: v.slice(0, 30) } : x))); }} onKeyDown=${(e) => e.key === "Enter" && e.target.blur()} aria-label="Nome da tag" />
      <div class="swatches">${R.TAG_COLORS.map((c) => html`<button key=${c} class="swatch" style=${{ background: c }} aria-label=${"Cor " + c} aria-pressed=${t.cor === c} onClick=${() => save(tags.map((x) => (x.id === t.id ? { ...x, cor: c } : x)))}></button>`)}</div>
      <${Confirm} className="btn ghost danger sm" label=${`Excluir${count(t.id) ? ` (${count(t.id)})` : ""}`} confirmLabel="Confirmar" onConfirm=${() => remove(t.id)} />
    </div>`)}
    <p class="small muted" style=${{ margin: "12px 0 0" }}>Excluir uma tag a remove das tarefas, sem apagar as tarefas.</p><//>`;
}
function Confirm({ label, confirmLabel, onConfirm, className = "btn danger sm" }) {

  useEffect(() => { if (!arm) return; const t = setTimeout(() => setArm(false), 4000); return () => clearTimeout(t); }, [arm]);
  return html`<button class=${className} onClick=${() => (arm ? (setArm(false), onConfirm()) : setArm(true))}>${arm ? confirmLabel : label}</button>`;
}

function QuickAdd({ defaults = {}, placeholder = "Nova tarefa… ex.: Ligar para Ana amanhã 14h #sdr p1", autoFocus, onAdded }) {
  const st = useStore();
  const [v, setV] = useState("");
  const ref = useRef(null);
  const projects = st.projectList();
  const parsed = useMemo(() => R.parseQuick(v, projects), [v, st.ver]);
  const pid = parsed.projectId ?? defaults.projectId ?? "inbox";
  const p = store.project(pid) ?? R.INBOX;
  function add(e) {
    e.preventDefault();
    if (!parsed.titulo) return;
    const r = R.resolveTags(p, parsed.tags);
    if (r.changed) store.saveProject({ ...p, tags: r.tags });
    const baseTags = parsed.projectId && parsed.projectId !== defaults.projectId ? [] : defaults.tags || [];
    const t = R.newTask({ ...defaults, ...Object.fromEntries(Object.entries(parsed).filter(([, x]) => x != null)), tags: [...new Set([...baseTags, ...r.ids])], stageId: parsed.projectId && parsed.projectId !== defaults.projectId ? undefined : defaults.stageId }, p);
    store.saveTask(t); setV(""); toast("Tarefa criada."); onAdded?.(t);
  }
  const hint = [parsed.data && `${R.relDay(parsed.data)}${parsed.hora ? " " + parsed.hora : ""}`, parsed.recorrencia && R.RECORRENCIA[parsed.recorrencia], parsed.prioridade && `P${parsed.prioridade}`, parsed.projectId && `#${p.nome}`, ...parsed.tags.map((x) => `@${x}`)].filter(Boolean);
  return html`<form class="quick" onSubmit=${add}>
    <div class="quick-box"><${Icon} n="plus" />
      <input ref=${ref} id=${"quick-" + (defaults.projectId || "g") + (defaults.stageId || "") + (defaults.data || "")} value=${v} onInput=${(e) => setV(e.target.value)} placeholder=${placeholder} autoFocus=${autoFocus} aria-label="Nova tarefa" autocomplete="off" />
      ${parsed.titulo && html`<button class="btn primary sm">Adicionar</button>`}</div>
    ${hint.length > 0 && html`<div class="chips">${hint.map((h) => html`<span key=${h} class="chip">${h}</span>`)}</div>`}
  </form>`;
}
function Bars({ data, goal, goalLabel = "meta", fmtTip }) {
  const [hover, setHover] = useState(null);
  const W = 620, H = 220, pl = 28, pr = 10, pt = 20, pb = 26;
  const maxV = Math.max(1, goal || 0, ...data.map((d) => d.value));
  const step = maxV <= 5 ? 1 : maxV <= 12 ? 2 : Math.ceil(maxV / 5);
  const top = Math.ceil(maxV / step) * step;
  const y = (v) => pt + (H - pt - pb) * (1 - v / top);
  const bw = (W - pl - pr) / data.length, barW = Math.min(30, bw * 0.62);
  const ticks = []; for (let v = 0; v <= top; v += step) ticks.push(v);
  return html`<div class="chart"><svg viewBox=${`0 0 ${W} ${H}`} role="img" aria-label="Gráfico de barras">
    ${ticks.map((v) => html`<g key=${v}><line x1=${pl} x2=${W - pr} y1=${y(v)} y2=${y(v)} stroke="var(--grid)" /><text x=${pl - 6} y=${y(v) + 4} text-anchor="end">${v}</text></g>`)}
    ${data.map((d, i) => { const x = pl + i * bw + (bw - barW) / 2, y0 = y(0), yv = y(d.value), h = y0 - yv, r = Math.min(4, h);
      const path = h > 0 ? `M${x},${y0} V${yv + r} Q${x},${yv} ${x + r},${yv} H${x + barW - r} Q${x + barW},${yv} ${x + barW},${yv + r} V${y0} Z` : "";
      return html`<g key=${i} onMouseEnter=${() => setHover(i)} onMouseLeave=${() => setHover(null)}><rect x=${pl + i * bw} y=${pt} width=${bw} height=${H - pt - pb} fill="transparent" />
        ${path && html`<path d=${path} fill=${hover === i ? "var(--bar-hover)" : "var(--bar)"} />`}
        ${d.value > 0 && html`<text class="val" x=${x + barW / 2} y=${yv - 5} text-anchor="middle">${d.value}</text>`}
        <text x=${x + barW / 2} y=${H - 8} text-anchor="middle">${d.label}</text></g>`; })}
    ${goal ? html`<g><line x1=${pl} x2=${W - pr} y1=${y(goal)} y2=${y(goal)} stroke="var(--accent)" stroke-dasharray="4 4" /><text x=${W - pr} y=${y(goal) - 5} text-anchor="end">${goalLabel}</text></g>` : null}
  </svg>${hover != null && html`<div class="tip" style=${{ left: `${((pl + hover * bw + bw / 2) / W) * 100}%`, top: `${(y(data[hover].value) / H) * 100}%` }}>${fmtTip ? fmtTip(data[hover]) : data[hover].value}</div>`}</div>`;
}
function Ring({ value, max }) {
  const pct = Math.min(1, value / Math.max(1, max)), r = 46, c = 2 * Math.PI * r;
  return html`<div class="ring"><svg width="88" height="88" viewBox="0 0 108 108"><circle cx="54" cy="54" r=${r} fill="none" stroke="var(--line)" stroke-width="5" />
    ${pct > 0 && html`<circle cx="54" cy="54" r=${r} fill="none" stroke=${pct >= 1 ? "var(--ok)" : "var(--accent)"} stroke-width="5" stroke-linecap="round" stroke-dasharray=${`${c * pct} ${c}`} />`}</svg>
    <div class="c"><div><b>${value}</b><div class="small muted">de ${max}</div></div></div></div>`;
}

/* ===== App ===== */
function App() {
  const st = useStore();
  const [route, setRoute] = useState({ view: "hoje" });
  const [modal, setModal] = useState(null);
  const [taskId, setTaskId] = useState(null);
  const today = useToday();
  const go = useCallback((view, extra = {}) => { setRoute({ view, ...extra }); window.scrollTo(0, 0); }, []);
  useEffect(() => {
    const k = (e) => {
      if ((e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === "f") { e.preventDefault(); setModal("busca"); return; }
      if (typing(e) || e.metaKey || e.ctrlKey || e.altKey || modalOpen()) return;
      if (e.key === "n" || e.key === "q") { e.preventDefault(); const f = () => document.querySelector(".quick-box input")?.focus(); if (document.querySelector(".quick-box input")) f(); else { go("hoje"); setTimeout(f, 50); } }
      else if (e.key === "?") setModal("help");
      else if (e.key === "h") go("hoje"); else if (e.key === "c") go("calendario"); else if (e.key === "d") go("dashboard"); else if (e.key === "p") go("proximos");
    };
    window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k);
  }, [go]);
  const tasks = st.taskList();
  const projects = st.projectList();
  const cnt = (f) => tasks.filter((t) => !t.concluida && f(t)).length;
  const nToday = cnt((t) => t.data && t.data <= today);
  const openTask = (id) => setTaskId(id);

  if (st.ready && !st.cfg.cadastrado) return html`<${Signup} /><${Toasts} />`;
  let body;
  if (!st.ready) body = html`<div class="boot" aria-label="Carregando seus projetos"><img src=${LOGO} alt="Rumo" /></div>`;
  else if (route.view === "projeto") body = html`<${ProjectView} key=${route.id} id=${route.id} tab=${route.tab} go=${go} open=${openTask} today=${today} openModal=${setModal} />`;
  else if (route.view === "calendario") body = html`<${CalendarView} open=${openTask} today=${today} />`;
  else if (route.view === "dashboard") body = html`<${DashboardView} today=${today} openModal=${setModal} />`;
  else if (route.view === "proximos") body = html`<${UpcomingView} open=${openTask} today=${today} />`;
  else body = html`<${TodayView} open=${openTask} today=${today} go=${go} openModal=${setModal} />`;

  const Nav = ({ v, ico, label, n, extra, cur }) => html`<button class="nav-btn" aria-current=${cur ? "page" : undefined} onClick=${() => go(v, extra)}><span class="ico">${ico}</span><span class="nl">${label}</span>${n ? html`<span class="cnt">${n}</span>` : null}</button>`;
  return html`<div class="shell">
    <aside class="side">
      <div class="logo"><img src=${LOGO} alt="" />Rumo</div>
      <button class="side-search" onClick=${() => setModal("busca")}><${Icon} n="search" /><span>Buscar</span><kbd>Ctrl F</kbd></button>
      <${Nav} v="hoje" ico=${html`<${Icon} n="sun" />`} label="Hoje" n=${nToday} cur=${route.view === "hoje"} />
      <${Nav} v="proximos" ico=${html`<${Icon} n="week" />`} label="Próximos 7 dias" cur=${route.view === "proximos"} />
      <${Nav} v="calendario" ico=${html`<${Icon} n="cal" />`} label="Calendário" cur=${route.view === "calendario"} />
      <${Nav} v="dashboard" ico=${html`<${Icon} n="chart" />`} label="Dashboard" cur=${route.view === "dashboard"} />
      <div class="side-sep"><span class="eyebrow side-projects-title">Projetos</span><button class="btn ghost sm" onClick=${() => setModal("novo-projeto")} aria-label="Novo projeto" title="Novo projeto"><${Icon} n="plus" s=${14} /></button></div>
      ${projects.map((p) => html`<${Nav} key=${p.id} v="projeto" extra=${{ id: p.id }} ico=${p.id === "inbox" ? html`<${Icon} n="inbox" />` : html`<${PDot} c=${p.cor} />`} label=${p.nome} n=${cnt((t) => t.projectId === p.id)} cur=${route.view === "projeto" && route.id === p.id} />`)}
      <button class="nav-btn" onClick=${() => setModal("novo-projeto")}><span class="ico"><${Icon} n="plus" /></span><span class="nl">Novo projeto</span></button>
      <button class="side-profile" onClick=${() => setModal("ajustes")} title="Meu perfil">
        ${st.me?.avatarUrl ? html`<img class="avatar" src=${st.me.avatarUrl} alt="" />` : html`<span class="avatar">${(st.cfg.nome || "?").slice(0, 1).toUpperCase()}</span>`}
        <span style=${{ minWidth: 0, flex: 1 }}><div class="nm">${st.cfg.nome || "Meu perfil"}</div><div class="mt">Meta de hoje: ${R.metrics(tasks, [], st.cfg, today).doneToday}/${st.cfg.metaDiaria}</div></span></button>
    </aside>
    <main class="work">
      ${st.mode === "local" && st.ready && html`<p class="note" style=${{ marginTop: 0 }}>Modo local: os dados ficam só neste navegador.</p>`}
      ${st.error && html`<p class="note" style=${{ marginTop: 0 }}>${st.error}</p>`}
      ${body}
    </main>
    ${taskId && html`<${TaskModal} id=${taskId} onClose=${() => setTaskId(null)} today=${today} />`}
    ${modal === "novo-projeto" && html`<${NewProject} onClose=${() => setModal(null)} go=${go} />`}
    ${modal === "ajustes" && html`<${Settings} onClose=${() => setModal(null)} />`}
    ${modal === "help" && html`<${Help} onClose=${() => setModal(null)} />`}
    ${modal?.editProject && html`<${EditProject} id=${modal.editProject} onClose=${() => setModal(null)} go=${go} />`}
    ${modal?.newTask && html`<${NewTaskModal} projectId=${modal.newTask} defaultTags=${modal.tags} onClose=${() => setModal(null)} today=${today} />`}
    ${modal === "busca" && html`<${SearchModal} onClose=${() => setModal(null)} open=${openTask} go=${go} today=${today} />`}
    <${Toasts} />
  </div>`;
}

function Signup() {

  const [f, setF] = useState(() => ({ nome: st.cfg.nome || st.me?.name || "", usos: [], metaDiaria: 5, inicio: "08:00", fim: "18:00", modelos: true, migrar: true }));

  const [err, setErr] = useState(null);
  const upd = (x) => setF({ ...f, ...x });
  const L = st.legacy && (st.legacy.projects.length || st.legacy.tasks.length) ? st.legacy : null;
  const modelos = f.usos.filter((u) => ["sdr", "estudos", "pessoal"].includes(u));
  async function submit(e) {
    e.preventDefault();
    if (!f.nome.trim()) return setErr("Informe como devemos te chamar.");
    if (f.inicio >= f.fim) return setErr("O fim do dia precisa ser depois do início.");
    setErr(null); setBusy("Criando sua conta…");
    try {
      if (L && f.migrar) { setBusy("Trazendo seus projetos…"); await store.migrateLegacy((i, n) => setBusy(`Trazendo seus projetos… ${i}/${n}`)); }
      if (f.modelos && modelos.length && !(L && f.migrar)) {
        for (const k of modelos) { const tpl = R.template(k); const { project, tasks } = R.buildProject({ nome: tpl.nome, cor: tpl.cor, icone: tpl.icone, descricao: tpl.descricao }, tpl); await store.saveProject(project); for (const t of tasks) await store.saveTask(t); }
      }
      await store.saveSettings({ nome: f.nome.trim(), usos: f.usos, metaDiaria: f.metaDiaria, inicio: f.inicio, fim: f.fim, cadastrado: true, cadastradoEm: Date.now() });

  const B = (t) => html`<li><${Icon} n="check" s=${16} w=${2.5} /><span>${t}</span></li>`;
  return html`<div class="signup">
    <div class="signup-brand">
      <div class="logo"><img src=${LOGO} alt="" />Rumo</div>
      <div class="stack" style=${{ gap: 14 }}><h1>Organize seus projetos e crie disciplina todos os dias.</h1>
        <p>Crie sua conta para salvar seus projetos e tarefas. Cada pessoa tem o próprio espaço, e ninguém mais vê o que é seu.</p></div>
      <ul>${B("Quadro kanban com etapas do seu jeito, lista e calendário")}${B("Meta diária e sequência de dias para manter o ritmo")}${B("O Claude monta o plano de cada projeto e organiza seu dia")}${B("Tags, prioridades, tarefas recorrentes e busca")}</ul>
    </div>
    <form class="signup-form" onSubmit=${submit}>
      <div><div class="eyebrow">Criar conta</div><h2>Vamos configurar o seu Rumo</h2></div>
      ${st.mode === "db" ? html`<div class="who">${st.me?.avatarUrl && html`<img src=${st.me.avatarUrl} alt="" />`}<div><div style=${{ fontWeight: 600 }}>${st.me?.name || "Sua conta do claude.ai"}</div><div class="small muted">Você entra com o login do claude.ai. Não é preciso criar senha.</div></div></div>`
        : html`<p class="note" style=${{ margin: 0 }}>Não foi possível identificar sua conta. O cadastro e os dados ficarão só neste navegador.</p>`}
      <div><label class="lbl" for="su-nome">Como devemos te chamar?</label><input id="su-nome" class="input" style=${{ height: 40 }} value=${f.nome} onInput=${(e) => upd({ nome: e.target.value })} autoFocus placeholder="Seu nome" /></div>
      <div><span class="lbl">Para que você vai usar o Rumo? (pode marcar mais de um)</span>
        <div class="choice">${USOS.map(([k, l]) => html`<button type="button" key=${k} aria-pressed=${f.usos.includes(k)} onClick=${() => upd({ usos: f.usos.includes(k) ? f.usos.filter((x) => x !== k) : [...f.usos, k] })}>${l}</button>`)}</div></div>
      <div class="form-grid" style=${{ gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))" }}>
        <div><span class="lbl">Meta de tarefas por dia</span><div class="stepper"><button type="button" aria-label="Diminuir" onClick=${() => upd({ metaDiaria: Math.max(1, f.metaDiaria - 1) })}>−</button><span>${f.metaDiaria}</span><button type="button" aria-label="Aumentar" onClick=${() => upd({ metaDiaria: Math.min(50, f.metaDiaria + 1) })}>+</button></div></div>
        <div><label class="lbl" for="su-ini">Seu dia começa</label><input id="su-ini" type="time" class="input" value=${f.inicio} onInput=${(e) => upd({ inicio: e.target.value })} /></div>
        <div><label class="lbl" for="su-fim">e termina</label><input id="su-fim" type="time" class="input" value=${f.fim} onInput=${(e) => upd({ fim: e.target.value })} /></div>
      </div>
      ${L ? html`<label class="check-line"><input type="checkbox" id="su-migrar" checked=${f.migrar} onChange=${(e) => upd({ migrar: e.target.checked })} /><span>Trazer para a minha conta ${((np, nt) => html`<b>${np} projeto${np === 1 ? "" : "s"}</b> e <b>${nt} tarefa${nt === 1 ? "" : "s"}</b>`)(L.projects.filter((x) => x.id !== "inbox").length, L.tasks.length)} que já criei. Tudo passa a ser privado.</span></label>`
        : modelos.length > 0 && html`<label class="check-line"><input type="checkbox" id="su-modelos" checked=${f.modelos} onChange=${(e) => upd({ modelos: e.target.checked })} /><span>Começar com projetos modelo: ${modelos.map((k) => R.template(k).nome).join(", ")}.</span></label>`}
      ${err && html`<p class="small" style=${{ color: "var(--bad)", margin: 0 }}>${err}</p>`}
      <button class="btn primary cta" disabled=${!!busy}>${busy || "Criar minha conta e entrar"}</button>
      <p class="small muted" style=${{ margin: 0 }}>Você pode mudar nome, meta e horário depois em “Meu perfil”, no menu lateral.</p>
    </form>
  </div>`;
}

  const tasks = st.taskList();
  const m = R.metrics(tasks, st.projectList(), cfg, today);
  const order = (a, b) => (a.hora || "99") .localeCompare(b.hora || "99") || a.prioridade - b.prioridade || a.ordem - b.ordem;
  const atrasadas = tasks.filter((t) => !t.concluida && t.data && t.data < today).sort((a, b) => a.data.localeCompare(b.data) || a.prioridade - b.prioridade);
  const hoje = tasks.filter((t) => !t.concluida && t.data === today).sort(order);
  const feitas = tasks.filter((t) => t.concluida && R.doneDay(t) === today).sort((a, b) => b.concluidaEm - a.concluidaEm);
  const [showDone, setShowDone] = useState(false);
  const h = new Date().getHours();
  const saud = h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite";
  const empty = st.taskList().length === 0 && st.projectList().length <= 1;
  return html`<div class="stack">
    <div class="head"><div><h1>${saud}${cfg.nome ? ", " + cfg.nome : ""}</h1><div class="sub">${R.DIAS_LONGO[new Date().getDay()]}, ${new Date().getDate()} de ${R.MESES_LONGO[new Date().getMonth()]}</div></div>
      <button class="btn sm" style=${{ marginLeft: "auto" }} onClick=${() => openModal("ajustes")}><${Icon} n="sliders" s=${14} />Meta e horário</button></div>
    <div class="today-top">
      <div class="stack">
        <${QuickAdd} defaults=${{ data: today }} placeholder="O que precisa ser feito hoje? ex.: Enviar proposta 15h #sdr p1" />
        ${empty && html`<div class="card"><h2>Comece por um projeto</h2><p style=${{ margin: "6px 0 12px" }}>Crie um projeto e o Claude te pergunta sobre ele para montar etapas, rotina e primeiras tarefas.</p><button class="btn primary" onClick=${() => openModal("novo-projeto")}>Criar projeto com o Claude</button></div>`}
        <${DayPlan} list=${[...atrasadas, ...hoje]} cfg=${cfg} today=${today} />
        ${atrasadas.length > 0 && html`<section><div class="sec-h" style=${{ color: "var(--bad)" }}>Atrasadas <span class="n">${atrasadas.length}</span>
          <button class="btn ghost sm" style=${{ marginLeft: "auto" }} onClick=${() => { atrasadas.forEach((t) => store.saveTask({ ...t, data: today })); toast(`${atrasadas.length} tarefas trazidas para hoje.`); }}>Trazer tudo para hoje</button></div>
          <ul class="tlist">${atrasadas.map((t) => html`<${TaskRow} key=${t.id} t=${t} today=${today} open=${open} />`)}</ul></section>`}
        <section><div class="sec-h">Hoje <span class="n">${hoje.length}</span></div>
          ${hoje.length === 0 ? html`<div class="empty">${atrasadas.length ? "Nada novo para hoje. Resolva as atrasadas acima." : "Nada planejado para hoje. Adicione uma tarefa acima ou puxe algo dos próximos dias."}</div>` : html`<ul class="tlist">${hoje.map((t) => html`<${TaskRow} key=${t.id} t=${t} today=${today} open=${open} />`)}</ul>`}</section>
        ${feitas.length > 0 && html`<section><button class="sec-h btn link" style=${{ color: "var(--ink-3)" }} onClick=${() => setShowDone(!showDone)}><${Icon} n=${showDone ? "down" : "right"} s=${14} /> Concluídas hoje <span class="n">${feitas.length}</span></button>
          ${showDone && html`<ul class="tlist">${feitas.map((t) => html`<${TaskRow} key=${t.id} t=${t} today=${today} open=${open} />`)}</ul>`}</section>`}
      </div>
      <div class="stack">
        <div class="card"><div class="eyebrow">Meta do dia</div>
          <div class="row" style=${{ gap: 16, marginTop: 8, flexWrap: "nowrap" }}><${Ring} value=${m.doneToday} max=${m.meta} />
            <div><div class="streak"><${Icon} n="flame" s=${18} />${m.streak} dia${m.streak === 1 ? "" : "s"}</div><div class="small muted">em sequência batendo a meta</div><div class="small muted" style=${{ marginTop: 6 }}>Recorde: ${m.best} · Semana: ${m.semana}/7</div></div></div>
          <p class="small" style=${{ margin: "12px 0 0" }}>${m.doneToday >= m.meta ? "Meta batida! Cada tarefa a mais é bônus." : `Faltam ${m.meta - m.doneToday} para a meta de hoje.`}</p></div>
        <div class="card small"><b>Atalhos</b><div class="muted" style=${{ marginTop: 4 }}><kbd>N</kbd> nova tarefa · <kbd>H</kbd> hoje · <kbd>P</kbd> próximos · <kbd>C</kbd> calendário · <kbd>D</kbd> dashboard · <kbd>?</kbd> ajuda</div>
          <div class="muted" style=${{ marginTop: 6 }}>Na caixa de tarefa: <b>amanhã</b>, <b>sexta</b>, <b>12/10</b>, <b>14h</b>, <b>#projeto</b>, <b>p1</b>, <b>todo dia</b>.</div></div>
      </div>
    </div>
  </div>`;
}
function DayPlan({ list, cfg, today }) {
  const ai = useAI();
  const [state, setState] = useState(null); // {loading, plan, error}
  const ctl = useRef(null);
  if (ai === false || list.length === 0) return null;
  async function run() {
    const sample = await getSample(); if (!sample) return setState({ error: "O Claude não está disponível aqui." });
    ctl.current = new AbortController(); setState({ loading: true });
    const n = new Date(); const nowHM = `${R.pad(n.getHours())}:${R.pad(Math.ceil(n.getMinutes() / 15) * 15 % 60)}`;
    try {
      const j = await sample.json(R.dayPlanPrompt(list, cfg, store.projectList(), today, nowHM < cfg.inicio ? cfg.inicio : nowHM), { signal: ctl.current.signal, cache: false });
      const blocos = (Array.isArray(j?.blocos) ? j.blocos : []).filter((b) => list.some((t) => t.id === b.id) && /^\d{1,2}:\d{2}$/.test(b.inicio || ""));
      setState({ plan: { resumo: String(j?.resumo || ""), dica: String(j?.dica || ""), blocos, adiar: Array.isArray(j?.adiar) ? j.adiar : [] } });
    } catch (e) { if (e?.code !== "cancelled") setState({ error: aiError(e) }); else setState(null); }
  }
  function apply() {
    for (const b of state.plan.blocos) { const t = list.find((x) => x.id === b.id); if (t) store.saveTask({ ...t, data: today, hora: b.inicio.padStart(5, "0") }); }
    toast("Horários aplicados às tarefas de hoje."); setState(null);
  }
  const name = (id) => list.find((t) => t.id === id)?.titulo ?? "?";
  return html`<div class="ai">
    <div class="row"><span class="ai-badge"><${Icon} n="spark" s=${14} />Claude</span><span class="small muted">Monte uma ordem realista para as ${list.length} tarefas de hoje.</span>
      ${!state?.loading && !state?.plan && html`<button class="btn dark sm" style=${{ marginLeft: "auto" }} onClick=${run}>Planejar meu dia</button>`}
      ${state?.loading && html`<button class="btn sm" style=${{ marginLeft: "auto" }} onClick=${() => ctl.current?.abort()}>Parar</button>`}</div>
    ${state?.loading && html`<p class="thinking" style=${{ margin: "10px 0 0" }}>Pensando no seu dia…</p>`}
    ${state?.error && html`<p class="small" style=${{ color: "var(--bad)", margin: "10px 0 0" }}>${state.error}</p>`}
    ${state?.plan && html`<div style=${{ marginTop: 10 }}><p style=${{ margin: "0 0 8px" }}>${state.plan.resumo}</p>
      <ul class="plan-list">${state.plan.blocos.map((b) => html`<li key=${b.id} class="row" style=${{ flexWrap: "nowrap", alignItems: "flex-start" }}><b class="mono" style=${{ width: 48, flex: "none" }}>${b.inicio}</b><span>${name(b.id)} <span class="small muted">· ${b.motivo || ""}</span></span></li>`)}</ul>
      ${state.plan.adiar.length > 0 && html`<p class="small muted">Adiar: ${state.plan.adiar.map(name).join(", ")}</p>`}
      ${state.plan.dica && html`<p class="small muted" style=${{ margin: "8px 0" }}>Dica: ${state.plan.dica}</p>`}
      <div class="row"><button class="btn primary sm" onClick=${apply}>Aplicar horários</button><button class="btn sm" onClick=${() => setState(null)}>Descartar</button></div></div>`}
  </div>`;
}
