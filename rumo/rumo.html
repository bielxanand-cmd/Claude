/* ===== Calendário ===== */
function CalendarView({ open, today, projectId, tagFilter = [] }) {
  const st = useStore();
  const [month, setMonth] = useState(() => today.slice(0, 7));
  const [sel, setSel] = useState(today);
  const [over, setOver] = useState(null);
  const [showDone, setShowDone] = useState(true);
  const tasks = st.taskList().filter((t) => t.data && (!projectId || t.projectId === projectId) && (showDone || !t.concluida) && (!tagFilter.length || (t.tags || []).some((x) => tagFilter.includes(x))));
  const [y, mo] = month.split("-").map(Number);
  const first = new Date(y, mo - 1, 1);
  const start = R.addDays(R.ymd(first), -((first.getDay() + 6) % 7));
  const cells = Array.from({ length: 42 }, (_, i) => R.addDays(start, i));
  const weeks = cells[35].slice(0, 7) === month ? 6 : 5;
  const byDay = (d) => tasks.filter((t) => t.data === d).sort((a, b) => (a.hora || "99").localeCompare(b.hora || "99") || a.prioridade - b.prioridade);
  const shift = (n) => { const d = new Date(y, mo - 1 + n, 1); setMonth(`${d.getFullYear()}-${R.pad(d.getMonth() + 1)}`); };
  const drop = (d, e) => { e.preventDefault(); setOver(null); const id = e.dataTransfer.getData("text/plain"); const t = store.taskList().find((x) => x.id === id); if (t && t.data !== d) { store.saveTask({ ...t, data: d }); toast(`Movida para ${R.relDay(d, today).toLowerCase()}.`); } };
  const color = (t) => store.project(t.projectId)?.cor ?? "#5b6472";
  const selList = byDay(sel);
  return html`<div class="stack">
    ${!projectId && html`<div class="head"><div><h1>Calendário</h1><div class="sub">Arraste uma tarefa para outro dia para reagendar.</div></div></div>`}
    <div class="row"><button class="btn ghost sm" onClick=${() => shift(-1)} aria-label="Mês anterior"><${Icon} n="left" /></button><h2 style=${{ minWidth: 150, textAlign: "center", textTransform: "capitalize" }}>${R.MESES_LONGO[mo - 1]} ${y}</h2><button class="btn ghost sm" onClick=${() => shift(1)} aria-label="Próximo mês"><${Icon} n="right" /></button>
      <button class="btn sm" onClick=${() => { setMonth(today.slice(0, 7)); setSel(today); }}>Hoje</button>
      <label class="small row" style=${{ marginLeft: "auto", gap: 6 }}><input type="checkbox" id="cal-done" checked=${showDone} onChange=${(e) => setShowDone(e.target.checked)} /> Mostrar concluídas</label></div>
    <div class="cal-layout">
      <div class="cal" role="grid">
        ${["seg", "ter", "qua", "qui", "sex", "sáb", "dom"].map((d) => html`<div key=${d} class="dow">${d}</div>`)}
        ${cells.slice(0, weeks * 7).map((d) => { const list = byDay(d);
          return html`<div key=${d} class=${"day" + (d.slice(0, 7) !== month ? " out" : "") + (d === today ? " today" : "") + (d === sel ? " sel" : "") + (over === d ? " over" : "")}
            onClick=${() => setSel(d)} onDragOver=${(e) => { e.preventDefault(); setOver(d); }} onDragLeave=${() => setOver((o) => (o === d ? null : o))} onDrop=${(e) => drop(d, e)}>
            <span class="dnum">${R.parseYmd(d).getDate()}</span>
            ${list.slice(0, 3).map((t) => html`<div key=${t.id} class=${"evt" + (t.concluida ? " done" : "")} style=${{ borderLeftColor: color(t) }} draggable="true" onDragStart=${(e) => e.dataTransfer.setData("text/plain", t.id)} onClick=${(e) => { e.stopPropagation(); open(t.id); }} title=${t.titulo}>${t.hora ? t.hora + " " : ""}${t.titulo}</div>`)}
            ${list.length > 3 && html`<span class="small muted">+${list.length - 3}</span>`}</div>`; })}
      </div>
      <div class="card"><div class="eyebrow">${R.relDay(sel, today)}</div><h2 style=${{ margin: "2px 0 10px" }}>${R.fmtDay(sel)}</h2>
        ${selList.length === 0 ? html`<div class="empty small">Nenhuma tarefa neste dia.</div>` : html`<ul class="tlist">${selList.map((t) => html`<${TaskRow} key=${t.id} t=${t} today=${today} open=${open} showProject=${!projectId} />`)}</ul>`}
        <div style=${{ marginTop: 10 }}><${QuickAdd} key=${sel} defaults=${{ data: sel, projectId }} placeholder="Adicionar neste dia…" /></div>
        <p class="small muted" style=${{ margin: "12px 0 0" }}>Cada tarefa com data tem o botão <b>Adicionar ao Google Agenda</b> no detalhe.</p></div>
    </div></div>`;
}

function Board({ p, tasks, open, today, tagDefaults = [] }) {
  const [drag, setDrag] = useState(null);
  const [over, setOver] = useState(null);
  const [before, setBefore] = useState(null);
  const [editing, setEditing] = useState(null);
  const [adding, setAdding] = useState(null);
  const col = (s) => tasks.filter((t) => t.stageId === s.id || (!p.stages.some((x) => x.id === t.stageId) && s === p.stages[0])).sort((a, b) => a.ordem - b.ordem);
  function drop(stageId, beforeId) {
    setOver(null); setBefore(null);
    const t = store.taskList().find((x) => x.id === drag); setDrag(null); if (!t) return;
    const list = col(p.stages.find((s) => s.id === stageId)).filter((x) => x.id !== t.id);
    let ordem;
    const i = beforeId ? list.findIndex((x) => x.id === beforeId) : -1;
    if (i === -1) ordem = (list.at(-1)?.ordem ?? Date.now()) + 1000;
    else ordem = i === 0 ? list[0].ordem - 1000 : (list[i - 1].ordem + list[i].ordem) / 2;
    const { task, next } = R.moveToStage(t, p, stageId);
    store.saveTask({ ...task, ordem }); if (next) store.saveTask(next);
    if (task.concluida && !t.concluida) toast("Tarefa concluída.", "", { label: "Desfazer", fn: () => { store.saveTask(t); if (next) store.deleteTask(next.id); } });
  }
  const saveStages = (stages) => store.saveProject({ ...p, stages });
  function stageAction(i, act) {
    const s = [...p.stages];
    if (act === "left" && i > 0) [s[i - 1], s[i]] = [s[i], s[i - 1]];
    if (act === "right" && i < s.length - 1) [s[i + 1], s[i]] = [s[i], s[i + 1]];
    if (act === "final") s.forEach((x, j) => (x.final = j === i ? !x.final : x.final));
    if (act === "delete") {
      if (s.length <= 1) return toast("O quadro precisa de pelo menos uma etapa.", "bad");
      const [gone] = s.splice(i, 1); const dest = s.find((x) => !x.final) ?? s[0];
      tasks.filter((t) => t.stageId === gone.id).forEach((t) => store.saveTask({ ...t, stageId: dest.id }));
    }
    saveStages(s);
  }
  return html`<div class="board">
    ${p.stages.map((s, i) => { const list = col(s);
      return html`<div key=${s.id} class=${"col" + (over === s.id ? " over" : "")} onDragOver=${(e) => { e.preventDefault(); setOver(s.id); }} onDragLeave=${(e) => { if (!e.currentTarget.contains(e.relatedTarget)) setOver((o) => (o === s.id ? null : o)); }} onDrop=${(e) => { e.preventDefault(); drop(s.id, before); }}>
        <div class="col-h">
          ${editing === s.id ? html`<input class="input" autoFocus defaultValue=${s.nome} id=${"stage-" + s.id} onBlur=${(e) => { const v = e.target.value.trim(); if (v) saveStages(p.stages.map((x) => (x.id === s.id ? { ...x, nome: v } : x))); setEditing(null); }} onKeyDown=${(e) => e.key === "Enter" && e.target.blur()} />`
            : html`<span class="name" onDoubleClick=${() => setEditing(s.id)} title="Clique duas vezes para renomear">${s.nome}${s.final ? html`<span class="muted" title="Etapa final: conclui as tarefas"><${Icon} n="check" s=${13} /></span>` : ""}</span><span class="small muted">${list.length}</span>`}
          <${StageMenu} s=${s} i=${i} n=${p.stages.length} onAct=${(a) => (a === "rename" ? setEditing(s.id) : stageAction(i, a))} />
        </div>
        <div class="col-list">${list.map((t) => html`<div key=${t.id} class=${"kcard" + (t.concluida ? " done" : "") + (drag === t.id ? " dragging" : "") + (before === t.id && over === s.id ? " drop-before" : "")} draggable="true"
            onDragStart=${(e) => { e.dataTransfer.setData("text/plain", t.id); e.dataTransfer.effectAllowed = "move"; setDrag(t.id); }} onDragEnd=${() => { setDrag(null); setOver(null); setBefore(null); }}
            onDragOver=${(e) => { e.preventDefault(); setOver(s.id); setBefore(t.id); }} onClick=${() => open(t.id)}>
          <button class=${"check p" + t.prioridade + (t.concluida ? " on" : "")} onClick=${(e) => { e.stopPropagation(); toggleDone(t); }} aria-label="Concluir"><${Icon} n="check" s=${11} w=${3} /></button>
          <div style=${{ minWidth: 0, flex: 1 }}>${t.tags?.length > 0 && html`<div class="ktags">${tagsOf(t, p).map((g) => html`<${TagChip} key=${g.id} tag=${g} />`)}</div>`}<div class="title">${t.titulo}</div>${t.notas?.trim() && html`<div class="knote" title=${t.notas}>${t.notas.trim()}</div>`}<${TaskMeta} t=${t} today=${today} showProject=${false} showNoteIcon=${false} showTags=${false} /></div></div>`)}
          <div style=${{ minHeight: 8 }} onDragOver=${(e) => { e.preventDefault(); setOver(s.id); setBefore(null); }}></div></div>
        ${adding === s.id ? html`<${QuickAdd} defaults=${{ projectId: p.id, stageId: s.id, tags: tagDefaults }} autoFocus placeholder="Título, data, @tag, p1…" />
          <button class="btn ghost sm" onClick=${() => setAdding(null)}>Fechar</button>` : html`<button class="btn ghost sm" style=${{ justifyContent: "flex-start" }} onClick=${() => setAdding(s.id)}><${Icon} n="plus" s=${14} />Adicionar tarefa</button>`}
      </div>`; })}
    <div class="add-col"><button class="btn ghost" style=${{ width: "100%", justifyContent: "flex-start" }} onClick=${() => { const s = { id: R.uid("s"), nome: "Nova etapa", final: false }; const fi = p.stages.findIndex((x) => x.final); const list = [...p.stages]; list.splice(fi === -1 ? list.length : fi, 0, s); saveStages(list); setEditing(s.id); }}><${Icon} n="plus" s=${14} />Nova etapa</button>
      <p class="small muted">Clique duas vezes no nome para renomear. A etapa marcada como final conclui as tarefas que chegam nela.</p></div>
  </div>`;
}
function StageMenu({ s, i, n, onAct }) {
  const [openM, setOpen] = useState(false);

      <${Confirm} className="nav-btn" label="Excluir etapa" confirmLabel="Confirmar exclusão" onConfirm=${() => act("delete")} /></div>`}</span>`;
}
function ProjectList({ p, tasks, open, today, tagDefaults = [] }) {
  const [showDone, setShowDone] = useState(false);

    <section><button class="sec-h btn link" style=${{ color: "var(--ink-3)" }} onClick=${() => setShowDone(!showDone)}><${Icon} n=${showDone ? "down" : "right"} s=${14} /> Concluídas <span class="n">${tasks.filter((t) => t.concluida).length}</span></button>
      ${showDone && html`<ul class="tlist">${tasks.filter((t) => t.concluida).sort((a, b) => b.concluidaEm - a.concluidaEm).slice(0, 100).map((t) => html`<${TaskRow} key=${t.id} t=${t} today=${today} open=${open} showProject=${false} />`)}</ul>`}</section></div>`;
}
function ProjectAI({ p, tasks, today }) {
  const ai = useAI();
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const [sug, setSug] = useState(null);
  const ctl = useRef(null);
  const chat = p.chat || [];
  async function send(e) {
    e?.preventDefault(); const text = msg.trim(); if (!text || busy) return;
    const sample = await getSample(); if (!sample) return setErr("O Claude não está disponível aqui.");
    const turns = [...chat, { role: "user", content: text }].slice(-12);
    const withMine = { ...p, chat: [...chat, { role: "user", content: text }].slice(-30) };
    store.saveProject(withMine); setMsg(""); setBusy(true); setErr(null); setSug(null);
    ctl.current = new AbortController();
    try {
      const firstUser = turns.findIndex((t) => t.role === "user");
      const input = [{ role: "user", content: R.projectChatInstructions(p, tasks, today) }, ...turns.slice(firstUser)];
      const j = await sample.json(input, { signal: ctl.current.signal, cache: false });
      const reply = String(j?.mensagem || "").trim() || "Certo.";
      store.saveProject({ ...withMine, chat: [...withMine.chat, { role: "assistant", content: reply }].slice(-30) });
      const plan = R.normalizePlan({ plano: { tarefas: j?.tarefas } });
      if (plan.tarefas.length && p.iaTarefas !== false) setSug({ list: plan.tarefas, sel: plan.tarefas.map(() => true) });
    } catch (e2) { if (e2?.code !== "cancelled") setErr(aiError(e2)); }
    finally { setBusy(false); }
  }
  function addSug() {
    const { tasks: novas } = R.buildProject({ nome: p.nome, cor: p.cor, icone: p.icone }, { etapas: p.stages.map((s) => s.nome), tarefas: sug.list }, { tarefas: sug.sel });
    novas.forEach((t) => store.saveTask({ ...t, projectId: p.id, stageId: R.firstOpenStage(p).id }));
    toast(`${novas.length} tarefas adicionadas ao projeto.`); setSug(null);
  }
  return html`<div class="grid-2">
    <div class="card stack" style=${{ gap: 10 }}><span class="ai-badge"><${Icon} n="spark" s=${14} />Plano do projeto</span>
      ${p.plano?.resumo ? html`<p style=${{ margin: 0, fontWeight: 600 }}>${p.plano.resumo}</p>` : html`<p class="muted" style=${{ margin: 0 }}>Este projeto ainda não tem um plano. Converse com o Claude ao lado para montar um.</p>`}
      ${p.plano?.mensagem && html`<p style=${{ margin: 0, whiteSpace: "pre-wrap" }}>${p.plano.mensagem}</p>`}
      ${p.plano?.dicas?.length > 0 && html`<div><div class="eyebrow" style=${{ marginBottom: 4 }}>Dicas</div><ul style=${{ margin: 0, paddingLeft: 18 }}>${p.plano.dicas.map((d, i) => html`<li key=${i}>${d}</li>`)}</ul></div>`}
    </div>
    <div class="card stack" style=${{ gap: 10 }}><span class="ai-badge"><${Icon} n="spark" s=${14} />Converse com o Claude sobre este projeto</span>
      ${p.iaTarefas === false && html`<p class="note" style=${{ margin: 0 }}>Geração de tarefas pausada: o Claude só vai orientar, sem propor tarefas. Reative no botão “Tarefas do Claude pausadas” no topo do projeto.</p>`}
      ${ai === false ? html`<p class="muted">O Claude não está disponível nesta visualização.</p>` : html`
      <div class="msgs">${chat.length === 0 && html`<div class="msg ai">Posso sugerir próximas tarefas, reorganizar prioridades ou ajustar as etapas. O que você precisa?</div>`}
        ${chat.map((m, i) => html`<div key=${i} class=${"msg " + (m.role === "user" ? "me" : "ai")}>${m.content}</div>`)}
        ${busy && html`<div class="msg ai thinking">Pensando…</div>`}</div>
      ${sug && html`<div class="card flat"><div class="eyebrow" style=${{ marginBottom: 6 }}>Tarefas sugeridas</div><ul class="plan-list">${sug.list.map((t, i) => html`<li key=${i}><label><input type="checkbox" checked=${sug.sel[i]} onChange=${() => setSug({ ...sug, sel: sug.sel.map((x, j) => (j === i ? !x : x)) })} />${t.titulo} <span class="small muted">· P${t.prioridade} · ${t.emDias === 0 ? "hoje" : `em ${t.emDias} dias`}</span></label></li>`)}</ul>
        <div class="row" style=${{ marginTop: 8 }}><button class="btn primary sm" onClick=${addSug}>Adicionar selecionadas</button><button class="btn sm" onClick=${() => setSug(null)}>Descartar</button></div></div>`}
      ${err && html`<p class="small" style=${{ color: "var(--bad)", margin: 0 }}>${err}</p>`}
      <form class="row" style=${{ flexWrap: "nowrap" }} onSubmit=${send}><input class="input" id="proj-chat" value=${msg} onInput=${(e) => setMsg(e.target.value)} placeholder="Ex.: o que devo priorizar esta semana?" />
        ${busy ? html`<button type="button" class="btn" onClick=${() => ctl.current?.abort()}>Parar</button>` : html`<button class="btn dark" disabled=${!msg.trim()}>Enviar</button>`}</form>
      ${chat.length > 0 && html`<${Confirm} className="btn ghost sm" label="Limpar conversa" confirmLabel="Confirmar" onConfirm=${() => store.saveProject({ ...p, chat: [] })} />`}`}
    </div></div>`;
}

      <div><label class="lbl" for="np-nome">Nome do projeto</label><input id="np-nome" class="input" value=${info.nome} onInput=${(e) => setInfo({ ...info, nome: e.target.value })} placeholder="Ex.: Lançar meu curso, Mudança de casa…" autoFocus /></div>

        <div><span class="lbl">Cor</span><div class="swatches">${R.PROJECT_COLORS.map((c) => html`<button key=${c} class="swatch" style=${{ background: c }} aria-label=${"Cor " + c} aria-pressed=${info.cor === c} onClick=${() => setInfo({ ...info, cor: c })}></button>`)}</div></div></div>
      ${err && html`<p class="small" style=${{ color: "var(--bad)", margin: 0 }}>${err}</p>`}
      ${tpl === "branco" && ai === false && html`<p class="note">O Claude não está disponível nesta visualização. O projeto será criado com as etapas padrão.</p>`}
      <div class="row" style=${{ justifyContent: "flex-end" }}>
        ${tpl === "branco" && ai && html`<button class="btn" onClick=${() => { if (!info.nome.trim()) return setErr("Dê um nome ao projeto."); create(R.template("branco")); }}>Criar em branco</button>`}
        <button class="btn primary" onClick=${next}>${tpl === "branco" ? (ai ? "Continuar com o Claude" : "Criar projeto") : "Ver plano do modelo"}</button></div></div>`}
    ${step === "chat" && html`<div class="stack" style=${{ gap: 12 }}>
      <div class="msgs" style=${{ maxHeight: "45vh", overflowY: "auto" }}>${chat.map((m, i) => html`<div key=${i} class=${"msg " + (m.role === "user" ? "me" : "ai")}>${m.content}</div>`)}
        ${busy && html`<div class="msg ai thinking">Pensando no seu projeto… (pode levar até um minuto)</div>`}</div>
      ${err && html`<p class="small" style=${{ color: "var(--bad)", margin: 0 }}>${err}</p>`}

function NewTaskModal({ projectId, onClose, today, defaultTags }) {
  const p = store.project(projectId) ?? R.INBOX;
  const [f, setF] = useState({ titulo: "", stageId: R.firstOpenStage(p).id, data: "", hora: "", prioridade: 4, recorrencia: "none", notas: "", tags: defaultTags || [] });
  const [more, setMore] = useState(false);
  const upd = (x) => setF({ ...f, ...x });
  const parsed = R.parseQuick(f.titulo, [p], today);
  function save(e, again) {
    e.preventDefault();
    const titulo = parsed.titulo || f.titulo.trim();
    if (!titulo) return;
    const cur = store.project(projectId) ?? R.INBOX;
    const rt = R.resolveTags(cur, parsed.tags);
    if (rt.changed) store.saveProject({ ...cur, tags: rt.tags });
    const t = R.newTask({ titulo, tags: [...new Set([...f.tags, ...rt.ids])], stageId: f.stageId, notas: f.notas, data: f.data || parsed.data, hora: f.hora || parsed.hora,
      prioridade: f.prioridade !== 4 ? f.prioridade : parsed.prioridade ?? 4, recorrencia: f.recorrencia !== "none" ? f.recorrencia : parsed.recorrencia ?? "none" }, p, today);
    const st = p.stages.find((s) => s.id === f.stageId);
    const final = st?.final ? R.setDone(t, p, true, today) : { task: t, next: null };
    store.saveTask({ ...final.task, stageId: f.stageId }); if (final.next) store.saveTask(final.next);
    toast("Tarefa criada.");
    if (again) setF({ ...f, titulo: "", notas: "" }); else onClose();
  }
  return html`<${Modal} title=${`Nova tarefa em ${p.nome}`} onClose=${onClose} wide>
    <form class="stack" style=${{ gap: 14 }} onSubmit=${(e) => save(e, false)}>
      <div><input id="nt-titulo" class="input" style=${{ height: 42, fontSize: 16 }} autoFocus value=${f.titulo} onInput=${(e) => upd({ titulo: e.target.value })} placeholder="O que precisa ser feito? Ex.: Resolver 30 questões de Português amanhã 19h p2" />
        ${(parsed.data || parsed.hora || parsed.prioridade || parsed.recorrencia) && html`<div class="chips" style=${{ marginTop: 6 }}>
          ${parsed.data && html`<span class="chip">${R.relDay(parsed.data, today)}${parsed.hora ? " " + parsed.hora : ""}</span>`}${parsed.recorrencia && html`<span class="chip">${R.RECORRENCIA[parsed.recorrencia]}</span>`}${parsed.prioridade && html`<span class="chip">P${parsed.prioridade}</span>`}</div>`}</div>
      <div class="form-grid">
        <div><label class="lbl" for="nt-stage">Etapa</label><select id="nt-stage" class="input" value=${f.stageId} onChange=${(e) => upd({ stageId: e.target.value })}>${p.stages.map((s) => html`<option key=${s.id} value=${s.id}>${s.nome}</option>`)}</select></div>
        <div><label class="lbl" for="nt-data">Data</label><input id="nt-data" type="date" class="input" value=${f.data} onInput=${(e) => upd({ data: e.target.value })} /></div>
        <div><label class="lbl" for="nt-hora">Horário</label><input id="nt-hora" type="time" class="input" value=${f.hora} onInput=${(e) => upd({ hora: e.target.value })} /></div>
        <div><label class="lbl" for="nt-prio">Prioridade</label><select id="nt-prio" class="input" value=${f.prioridade} onChange=${(e) => upd({ prioridade: Number(e.target.value) })}>${[1, 2, 3, 4].map((n) => html`<option key=${n} value=${n}>${PRIO_LABEL[n]}</option>`)}</select></div>
      </div>
      <div><span class="lbl">Tags</span><${TagPicker} projectId=${projectId} value=${f.tags} onChange=${(tags) => upd({ tags })} /></div>
      ${more ? html`<div class="form-grid">
          <div><label class="lbl" for="nt-rec">Repetir</label><select id="nt-rec" class="input" value=${f.recorrencia} onChange=${(e) => upd({ recorrencia: e.target.value })}>${Object.entries(R.RECORRENCIA).map(([k, v]) => html`<option key=${k} value=${k}>${v}</option>`)}</select></div>
          <div class="span-all"><label class="lbl" for="nt-notas">Anotações</label><textarea id="nt-notas" class="input" rows="3" value=${f.notas} onInput=${(e) => upd({ notas: e.target.value })}></textarea></div></div>`
        : html`<button type="button" class="btn link" style=${{ alignSelf: "flex-start" }} onClick=${() => setMore(true)}>+ Repetição e anotações</button>`}
      <div class="row" style=${{ justifyContent: "flex-end" }}>
        <button type="button" class="btn" disabled=${!f.titulo.trim()} onClick=${(e) => save(e, true)}>Criar e adicionar outra</button>
        <button class="btn primary" disabled=${!f.titulo.trim()}>Criar tarefa</button></div>
    </form><//>`;
}

/* ===== Busca global ===== */
function Hl({ text, q }) {
  if (!q) return text;
  const n = R.norm(text), i = n.indexOf(q);
  if (i < 0 || n.length !== text.length) return text;
  return html`${text.slice(0, i)}<mark>${text.slice(i, i + q.length)}</mark>${text.slice(i + q.length)}`;
}
function SearchModal({ onClose, open, go, today }) {
  const st = useStore();
  const [q, setQ] = useState("");
  const [sel, setSel] = useState(0);
  const [done, setDone] = useState(false);
  const nq = R.norm(q.trim());
  const results = useMemo(() => {
    if (!nq) return [];
    const ps = st.projectList().filter((p) => R.norm(`${p.nome} ${p.descricao || ""}`).includes(nq)).map((p) => ({ kind: "p", p, key: "p" + p.id }));
    const ts = st.taskList().filter((t) => (done || !t.concluida) && R.norm([t.titulo, t.notas, ...(t.subtarefas || []).map((x) => x.t), ...tagsOf(t, store.project(t.projectId)).map((g) => g.nome)].join(" ")).includes(nq))
      .sort((a, b) => a.concluida - b.concluida || (a.data || "9999").localeCompare(b.data || "9999")).slice(0, 60).map((t) => ({ kind: "t", t, key: "t" + t.id }));
    return [...ps, ...ts];
  }, [nq, done, st.ver]);
  useEffect(() => setSel(0), [nq, done]);
  useEffect(() => { document.getElementById("sr-" + sel)?.scrollIntoView({ block: "nearest" }); }, [sel]);
  const pick = (r) => { onClose(); if (r.kind === "p") go("projeto", { id: r.p.id }); else open(r.t.id); };
  const onKey = (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); setSel((s) => Math.min(results.length - 1, s + 1)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setSel((s) => Math.max(0, s - 1)); }
    else if (e.key === "Enter" && results[sel]) { e.preventDefault(); pick(results[sel]); }
  };
  const firstT = results.findIndex((r) => r.kind === "t");
  return html`<${Modal} title="Buscar" onClose=${onClose} wide>
    <div class="search-box"><${Icon} n="search" s=${18} /><input id="busca" autoFocus value=${q} onInput=${(e) => setQ(e.target.value)} onKeyDown=${onKey} placeholder="Buscar tarefas, anotações, subtarefas e projetos…" aria-label="Buscar" />
      <label class="small row" style=${{ gap: 6, flexWrap: "nowrap" }}><input type="checkbox" id="busca-feitas" checked=${done} onChange=${(e) => setDone(e.target.checked)} />Incluir concluídas</label></div>
    ${!nq ? html`<p class="small muted" style=${{ margin: "8px 4px" }}>Digite para buscar em todos os projetos. Use ↑ ↓ para navegar e Enter para abrir.</p>`
      : results.length === 0 ? html`<p class="small muted" style=${{ margin: "8px 4px" }}>Nada encontrado para “${q.trim()}”.</p>`
      : html`<ul class="results">${results.map((r, i) => {
          const head = i === 0 && r.kind === "p" ? "Projetos" : i === firstT ? "Tarefas" : null;
          if (r.kind === "p") return html`<li key=${r.key}>${head && html`<div class="grp">${head}</div>`}<button id=${"sr-" + i} class=${sel === i ? "sel" : ""} onMouseEnter=${() => setSel(i)} onClick=${() => pick(r)}>
            <span class="dot" style=${{ background: r.p.cor, marginTop: 6 }}></span><span><div class="rt"><${Hl} text=${r.p.nome} q=${nq} /></div>${r.p.descricao && html`<div class="rs">${r.p.descricao.slice(0, 90)}</div>`}</span></button></li>`;
          const t = r.t, p = store.project(t.projectId);
          const stage = p?.stages.find((s) => s.id === t.stageId)?.nome;
          return html`<li key=${r.key}>${head && html`<div class="grp">${head}</div>`}<button id=${"sr-" + i} class=${sel === i ? "sel" : ""} onMouseEnter=${() => setSel(i)} onClick=${() => pick(r)}>
            <span class=${"check p" + t.prioridade + (t.concluida ? " on" : "")} style=${{ marginTop: 1 }}><${Icon} n="check" s=${11} w=${3} /></span>
            <span style=${{ minWidth: 0 }}><div class="rt" style=${t.concluida ? { textDecoration: "line-through", color: "var(--ink-3)" } : null}><${Hl} text=${t.titulo} q=${nq} /></div>
              <div class="rs">${[p?.nome, stage, t.data && `${R.relDay(t.data, today)}${t.hora ? " " + t.hora : ""}`].filter(Boolean).join(" · ")}</div></span></button></li>`;
        })}</ul>`}
  <//>`;
}

    <div class="form-grid">
      <div class="span-all who">${store.me?.avatarUrl && html`<img src=${store.me.avatarUrl} alt="" />`}<div><div style=${{ fontWeight: 600 }}>${f.nome || "Sem nome"}</div><div class="small muted">${store.mode === "db" ? "Conta vinculada ao seu login do claude.ai. Seus projetos são privados." : "Dados salvos só neste navegador."}</div></div></div>
      <div class="span-all"><label class="lbl" for="cf-nome">Como devo te chamar?</label><input id="cf-nome" class="input" value=${f.nome} onInput=${(e) => setF({ ...f, nome: e.target.value })} /></div>
      <div><label class="lbl" for="cf-meta">Meta de tarefas concluídas por dia</label><input id="cf-meta" type="number" min="1" class="input" value=${f.metaDiaria} onInput=${(e) => setF({ ...f, metaDiaria: Math.max(1, Number(e.target.value) || 1) })} /></div>
      <div><label class="lbl" for="cf-ini">Início do dia de trabalho</label><input id="cf-ini" type="time" class="input" value=${f.inicio} onInput=${(e) => setF({ ...f, inicio: e.target.value })} /></div>
      <div><label class="lbl" for="cf-fim">Fim do dia de trabalho</label><input id="cf-fim" type="time" class="input" value=${f.fim} onInput=${(e) => setF({ ...f, fim: e.target.value })} /></div>
      <p class="small muted span-all" style=${{ margin: 0 }}>A sequência conta os dias seguidos em que você bate a meta. O horário é usado pelo Claude ao planejar seu dia.</p>
      <div class="span-all row" style=${{ justifyContent: "flex-end" }}><button class="btn primary" onClick=${() => { store.saveSettings(f); onClose(); toast("Salvo."); }}>Salvar</button></div>
    </div><//>`;
}
function Help({ onClose }) {
  return html`<${Modal} title="Como usar" onClose=${onClose} wide><div class="grid-2">
    <div><b>Atalhos</b><ul style=${{ paddingLeft: 18 }}><li><kbd>Ctrl</kbd> + <kbd>F</kbd> buscar</li><li><kbd>N</kbd> nova tarefa</li><li><kbd>H</kbd> Hoje · <kbd>P</kbd> Próximos · <kbd>C</kbd> Calendário · <kbd>D</kbd> Dashboard</li><li><kbd>Esc</kbd> fecha janelas (e salva a tarefa aberta)</li></ul></div>
    <div><b>Escreva naturalmente</b><ul style=${{ paddingLeft: 18 }}><li><b>hoje, amanhã, sexta, 12/10, em 3 dias</b></li><li><b>14h, 9h30, 16:45</b></li><li><b>#nome-do-projeto</b></li><li><b>p1</b> a <b>p4</b> (prioridade)</li><li><b>@tag</b> (cria a tag se não existir)</li><li><b>todo dia, dias úteis, toda semana, todo mês</b></li></ul></div>
  </div><//>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
store.init();
})();
</script>
